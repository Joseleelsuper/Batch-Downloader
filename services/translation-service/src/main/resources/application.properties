spring.application.name=translation-service
server.port=${TRANSLATION_SERVICE_SERVER_PORT}
translation.locales-path=${TRANSLATION_SERVICE_LOCALES_PATH}
translation.cache-max-age=${TRANSLATION_SERVICE_CACHE_MAX_AGE}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,ping
management.metrics.tags.application=${spring.application.name}
