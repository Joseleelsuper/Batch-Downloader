spring.application.name=translation-service
server.port=${TRANSLATION_SERVICE_SERVER_PORT:8080}
translation.locales-path=${TRANSLATION_SERVICE_LOCALES_PATH:locales}
translation.cache-max-age=${TRANSLATION_SERVICE_CACHE_MAX_AGE:PT1H}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
