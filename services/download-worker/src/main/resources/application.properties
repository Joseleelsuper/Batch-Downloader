spring.application.name=download-worker
server.port=${DOWNLOAD_WORKER_SERVER_PORT}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.datasource.url=${DOWNLOAD_WORKER_INBOX_URL}
spring.datasource.username=${DOWNLOAD_WORKER_INBOX_USERNAME}
spring.datasource.password=${DOWNLOAD_WORKER_INBOX_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.sql.init.mode=always

download-worker.messaging.command-exchange=${DOWNLOAD_WORKER_COMMAND_EXCHANGE}
download-worker.messaging.event-exchange=${DOWNLOAD_WORKER_EVENT_EXCHANGE}
download-worker.messaging.input-routing-key=${DOWNLOAD_WORKER_INPUT_ROUTING_KEY}
download-worker.messaging.input-queue=${DOWNLOAD_WORKER_INPUT_QUEUE}
download-worker.messaging.cancellation-routing-key=${DOWNLOAD_WORKER_CANCELLATION_ROUTING_KEY}
download-worker.messaging.cancellation-queue=${DOWNLOAD_WORKER_CANCELLATION_QUEUE}
download-worker.messaging.dead-letter-exchange=${DOWNLOAD_WORKER_DLX}
download-worker.messaging.dead-letter-queue=${DOWNLOAD_WORKER_DLQ}
download-worker.messaging.retry-attempts=${DOWNLOAD_WORKER_RETRY_ATTEMPTS}
download-worker.messaging.retry-initial-interval=${DOWNLOAD_WORKER_RETRY_INITIAL_INTERVAL}
download-worker.messaging.retry-multiplier=${DOWNLOAD_WORKER_RETRY_MULTIPLIER}
download-worker.messaging.retry-max-interval=${DOWNLOAD_WORKER_RETRY_MAX_INTERVAL}

download-worker.storage.endpoint=${MINIO_ENDPOINT}
download-worker.storage.access-key=${MINIO_ROOT_USER}
download-worker.storage.secret-key=${MINIO_ROOT_PASSWORD}
download-worker.storage.bucket=${MINIO_ZIP_BUCKET}
download-worker.storage.presigned-url-ttl=${DOWNLOAD_WORKER_PRESIGNED_TTL}

download-worker.source-resolver.base-url=${DOWNLOAD_WORKER_SOURCE_RESOLVER_URL}
download-worker.source-resolver.service-token=${SCRAPPER_INTERNAL_SERVICE_TOKEN}
download-worker.source-resolver.timeout=${DOWNLOAD_WORKER_SOURCE_RESOLVER_TIMEOUT}

download-worker.core-api.base-url=${DOWNLOAD_WORKER_CORE_API_URL}
download-worker.core-api.service-token=${SCRAPPER_INTERNAL_SERVICE_TOKEN}
download-worker.core-api.timeout=${DOWNLOAD_WORKER_CORE_API_TIMEOUT}

download-worker.download.max-items=${DOWNLOAD_WORKER_MAX_ITEMS}
download-worker.download.max-file-size=${DOWNLOAD_WORKER_MAX_FILE_SIZE}
download-worker.download.max-total-size=${DOWNLOAD_WORKER_MAX_TOTAL_SIZE}
download-worker.download.max-redirects=${DOWNLOAD_WORKER_MAX_REDIRECTS}
download-worker.download.connect-timeout=${DOWNLOAD_WORKER_CONNECT_TIMEOUT}
download-worker.download.request-timeout=${DOWNLOAD_WORKER_REQUEST_TIMEOUT}
download-worker.download.concurrency=${DOWNLOAD_WORKER_CONCURRENCY}
download-worker.download.job-concurrency=${DOWNLOAD_WORKER_JOB_CONCURRENCY}
download-worker.download.per-job-concurrency=${DOWNLOAD_WORKER_PER_JOB_CONCURRENCY}
download-worker.download.packaging-concurrency=${DOWNLOAD_WORKER_PACKAGING_CONCURRENCY}
download-worker.download.zip-level=${DOWNLOAD_WORKER_ZIP_LEVEL}
download-worker.download.min-free-space=${DOWNLOAD_WORKER_MIN_FREE_SPACE}
download-worker.download.large-job-threshold=${DOWNLOAD_WORKER_LARGE_JOB_THRESHOLD}
download-worker.download.multipart-part-size=${DOWNLOAD_WORKER_MULTIPART_PART_SIZE}
download-worker.download.inbox-lease=${DOWNLOAD_WORKER_INBOX_LEASE}
download-worker.download.temp-directory=${DOWNLOAD_WORKER_TEMP_DIRECTORY}
