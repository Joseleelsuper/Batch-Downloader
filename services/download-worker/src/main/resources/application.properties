spring.application.name=download-worker
server.port=${DOWNLOAD_WORKER_SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:batch_downloader}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:batch_downloader}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.datasource.url=${DOWNLOAD_WORKER_INBOX_URL:jdbc:h2:file:/app/data/download-inbox;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DOWNLOAD_WORKER_INBOX_USERNAME:sa}
spring.datasource.password=${DOWNLOAD_WORKER_INBOX_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

download-worker.messaging.command-exchange=${DOWNLOAD_WORKER_COMMAND_EXCHANGE:batch.commands.v1}
download-worker.messaging.event-exchange=${DOWNLOAD_WORKER_EVENT_EXCHANGE:batch.events.v1}
download-worker.messaging.input-routing-key=${DOWNLOAD_WORKER_INPUT_ROUTING_KEY:download.job.requested}
download-worker.messaging.input-queue=${DOWNLOAD_WORKER_INPUT_QUEUE:download-worker.download.job.requested.v1}
download-worker.messaging.dead-letter-exchange=${DOWNLOAD_WORKER_DLX:batch.dead-letter.v1}
download-worker.messaging.dead-letter-queue=${DOWNLOAD_WORKER_DLQ:download-worker.download.job.requested.v1.dlq}
download-worker.messaging.retry-attempts=${DOWNLOAD_WORKER_RETRY_ATTEMPTS:3}
download-worker.messaging.retry-initial-interval=${DOWNLOAD_WORKER_RETRY_INITIAL_INTERVAL:1s}
download-worker.messaging.retry-multiplier=${DOWNLOAD_WORKER_RETRY_MULTIPLIER:2.0}
download-worker.messaging.retry-max-interval=${DOWNLOAD_WORKER_RETRY_MAX_INTERVAL:10s}

download-worker.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
download-worker.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
download-worker.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
download-worker.storage.bucket=${DOWNLOAD_WORKER_MINIO_BUCKET:installers}
download-worker.storage.presigned-url-ttl=${DOWNLOAD_WORKER_PRESIGNED_TTL:24h}

download-worker.source-resolver.base-url=${DOWNLOAD_WORKER_SOURCE_RESOLVER_URL:http://scraper-api:8000}
download-worker.source-resolver.service-token=${DOWNLOAD_WORKER_INTERNAL_SERVICE_TOKEN:development-internal-token}
download-worker.source-resolver.timeout=${DOWNLOAD_WORKER_SOURCE_RESOLVER_TIMEOUT:10s}

download-worker.download.max-items=${DOWNLOAD_WORKER_MAX_ITEMS:100}
download-worker.download.max-file-size=${DOWNLOAD_WORKER_MAX_FILE_SIZE:1500MB}
download-worker.download.max-total-size=${DOWNLOAD_WORKER_MAX_TOTAL_SIZE:4GB}
download-worker.download.max-redirects=${DOWNLOAD_WORKER_MAX_REDIRECTS:5}
download-worker.download.connect-timeout=${DOWNLOAD_WORKER_CONNECT_TIMEOUT:10s}
download-worker.download.request-timeout=${DOWNLOAD_WORKER_REQUEST_TIMEOUT:15m}
download-worker.download.concurrency=${DOWNLOAD_WORKER_CONCURRENCY:4}
download-worker.download.inbox-lease=${DOWNLOAD_WORKER_INBOX_LEASE:30m}
download-worker.download.temp-directory=${DOWNLOAD_WORKER_TEMP_DIRECTORY:/tmp/batch-downloader}
