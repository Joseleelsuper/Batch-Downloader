spring.application.name=notification-service
server.port=${NOTIFICATION_SERVICE_SERVER_PORT}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS}
spring.rabbitmq.listener.simple.retry.initial-interval=${NOTIFICATION_RETRY_INITIAL_INTERVAL}
spring.rabbitmq.listener.simple.retry.multiplier=${NOTIFICATION_RETRY_MULTIPLIER}
spring.rabbitmq.listener.simple.retry.max-interval=${NOTIFICATION_RETRY_MAX_INTERVAL}

spring.datasource.url=${NOTIFICATION_SERVICE_INBOX_URL}
spring.datasource.username=${NOTIFICATION_SERVICE_INBOX_USERNAME}
spring.datasource.password=${NOTIFICATION_SERVICE_INBOX_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.sql.init.mode=always

spring.mail.host=${NOTIFICATION_SERVICE_SMTP_HOST}
spring.mail.port=${NOTIFICATION_SERVICE_SMTP_PORT}
spring.mail.username=${NOTIFICATION_SERVICE_SMTP_USERNAME}
spring.mail.password=${NOTIFICATION_SERVICE_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${NOTIFICATION_SERVICE_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${NOTIFICATION_SERVICE_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=${NOTIFICATION_SERVICE_SMTP_CONNECTION_TIMEOUT_MS}
spring.mail.properties.mail.smtp.timeout=${NOTIFICATION_SERVICE_SMTP_TIMEOUT_MS}
spring.mail.properties.mail.smtp.writetimeout=${NOTIFICATION_SERVICE_SMTP_WRITE_TIMEOUT_MS}

notification.rabbit.exchange=${RABBITMQ_COMMAND_EXCHANGE}
notification.rabbit.routing-key=notification.email.requested
notification.rabbit.queue=notification.email-requests.v1
notification.rabbit.dead-letter-exchange=batch-downloader.dlx
notification.rabbit.dead-letter-routing-key=batch.commands.v1.notification.email.requested.dead
notification.rabbit.dead-letter-queue=notification.email-requests.dlq.v1
notification.inbox.lease-duration=${NOTIFICATION_SERVICE_INBOX_LEASE_DURATION}
notification.mail.from=${NOTIFICATION_SERVICE_MAIL_FROM}
notification.mail.zone-id=${NOTIFICATION_SERVICE_MAIL_ZONE_ID}
notification.mail.public-base-url=${NOTIFICATION_SERVICE_PUBLIC_BASE_URL}
