spring.application.name=notification-service
server.port=${NOTIFICATION_SERVICE_SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:batch_downloader}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:batch_downloader}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${NOTIFICATION_RETRY_INITIAL_INTERVAL:1s}
spring.rabbitmq.listener.simple.retry.multiplier=${NOTIFICATION_RETRY_MULTIPLIER:2}
spring.rabbitmq.listener.simple.retry.max-interval=${NOTIFICATION_RETRY_MAX_INTERVAL:10s}

spring.datasource.url=${NOTIFICATION_SERVICE_INBOX_URL:jdbc:h2:file:./data/notification-inbox;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${NOTIFICATION_SERVICE_INBOX_USERNAME:sa}
spring.datasource.password=${NOTIFICATION_SERVICE_INBOX_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

spring.mail.host=${NOTIFICATION_SERVICE_SMTP_HOST:localhost}
spring.mail.port=${NOTIFICATION_SERVICE_SMTP_PORT:25}
spring.mail.username=${NOTIFICATION_SERVICE_SMTP_USERNAME:}
spring.mail.password=${NOTIFICATION_SERVICE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${NOTIFICATION_SERVICE_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${NOTIFICATION_SERVICE_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${NOTIFICATION_SERVICE_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${NOTIFICATION_SERVICE_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${NOTIFICATION_SERVICE_SMTP_WRITE_TIMEOUT_MS:10000}

notification.rabbit.exchange=${RABBITMQ_COMMAND_EXCHANGE:batch.commands.v1}
notification.rabbit.routing-key=notification.email.requested
notification.rabbit.queue=notification.email-requests.v1
notification.rabbit.dead-letter-exchange=batch-downloader.dlx
notification.rabbit.dead-letter-routing-key=batch.commands.v1.notification.email.requested.dead
notification.rabbit.dead-letter-queue=notification.email-requests.dlq.v1
notification.inbox.lease-duration=${NOTIFICATION_SERVICE_INBOX_LEASE_DURATION:PT5M}
notification.mail.from=${NOTIFICATION_SERVICE_MAIL_FROM:no-reply@batch-downloader.local}
notification.mail.zone-id=${NOTIFICATION_SERVICE_MAIL_ZONE_ID:Europe/Madrid}
notification.mail.public-base-url=${NOTIFICATION_SERVICE_PUBLIC_BASE_URL:http://localhost:3000}
