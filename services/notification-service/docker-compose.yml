services:
  notification-service:
    build:
      context: .
    environment:
      NOTIFICATION_SERVICE_SERVER_PORT: ${NOTIFICATION_SERVICE_SERVER_PORT:-8080}
      RABBITMQ_HOST: ${NOTIFICATION_SERVICE_RABBITMQ_HOST:-rabbitmq}
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8083}:${NOTIFICATION_SERVICE_SERVER_PORT:-8080}"
