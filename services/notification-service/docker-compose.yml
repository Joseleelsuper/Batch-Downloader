services:
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - path: ./.env.example
      - path: ./.env
        required: false
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      NOTIFICATION_SERVICE_TRANSLATION_URL: ${NOTIFICATION_SERVICE_TRANSLATION_URL:-http://translation-service:8080}
      NOTIFICATION_SERVICE_TRANSLATION_CONNECT_TIMEOUT: ${NOTIFICATION_SERVICE_TRANSLATION_CONNECT_TIMEOUT:-2s}
      NOTIFICATION_SERVICE_TRANSLATION_REQUEST_TIMEOUT: ${NOTIFICATION_SERVICE_TRANSLATION_REQUEST_TIMEOUT:-5s}
      NOTIFICATION_SERVICE_TRANSLATION_CACHE_TTL: ${NOTIFICATION_SERVICE_TRANSLATION_CACHE_TTL:-5m}
      NOTIFICATION_SERVICE_TRANSLATION_FALLBACK_LOCALE: ${NOTIFICATION_SERVICE_TRANSLATION_FALLBACK_LOCALE:-es}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
    cpu_shares: 256
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_HOST_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      translation-service:
        condition: service_healthy
    volumes:
      - notification_service_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  notification_service_data:
