[project]
name = "batch-downloader-semantic-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "psycopg[binary,pool]==3.3.6",
  "pydantic-settings==2.16.2",
  "sentence-transformers==5.7.0",
  "torch==2.15.0",
  "transformers==5.21.0",
  "uvicorn==0.54.0",
  "websockets==15.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
test = [
  "mypy==2.4.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "testcontainers[postgres]==4.15.0",
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
# El indexador mantiene un flujo revisable.
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 52
show_missing = true
skip_covered = false

[project.scripts]
semantic-migrator = "app.migrator:main"
semantic-indexer = "app.indexer:main"
semantic-model-validate = "app.model_validation:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
