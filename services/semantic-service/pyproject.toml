[project]
name = "batch-downloader-semantic-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "numpy==2.5.1",
  "peft==0.19.1",
  "psutil==7.2.2",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.14.2",
  "scikit-learn==1.9.0",
  "sentence-transformers==5.6.1",
  "torch==2.13.0",
  "transformers==5.14.1",
  "uvicorn==0.51.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.14.2",
]

[project.scripts]
semantic-indexer = "app.indexer:main"
semantic-model = "app.model_admin:main"
semantic-trainer = "app.trainer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
