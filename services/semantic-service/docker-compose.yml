x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  semantic-service:
    build:
      context: .
    env_file:
      - path: ./.env
        required: true
    environment:
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB:?}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER:?}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN?}
      SEMANTIC_CORE_API_URL: ${SEMANTIC_CORE_API_URL:?}
    cpu_shares: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEMANTIC_SERVICE_HOST_PORT:?}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/semantic/health/ready', timeout=3).read()",
        ]
      start_period: 180s

  semantic-indexer:
    build:
      context: .
    command: ["python", "-m", "app.indexer", "--loop"]
    env_file:
      - path: ./.env
        required: true
    environment:
      SEMANTIC_DATABASE_ROLE: ${SEMANTIC_INDEXER_DATABASE_ROLE:?}
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB:?}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER:?}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN?}
      SEMANTIC_CORE_API_URL: ${SEMANTIC_CORE_API_URL:?}
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "indexer", "--writable", "/models"]
      interval: 30s
      retries: 3
      start_period: 120s

volumes:
  semantic_models:
    name: ${SEMANTIC_MODELS_VOLUME_NAME:?}
