services:
  semantic-service:
    build:
      context: .
    env_file:
      - path: ./.env.example
      - path: ./.env
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_DIR: /models/current
      SEMANTIC_MODEL_RUNTIME_CACHE_DIR: /models/runtime-cache
      SEMANTIC_MODEL_MANIFEST_NAME: batch-model.json
    cpu_shares: 512
    restart: unless-stopped
    ports:
      - "${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/semantic/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  semantic-indexer:
    build:
      context: .
    command: ["python", "-m", "app.indexer", "--loop"]
    env_file:
      - path: ./.env.indexer.example
      - path: ./.env.indexer
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_DIR: /models/current
      SEMANTIC_MODEL_RUNTIME_CACHE_DIR: /models/runtime-cache
      SEMANTIC_MODEL_MANIFEST_NAME: batch-model.json
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "indexer", "--writable", "/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  semantic_models:
