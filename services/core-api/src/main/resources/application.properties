spring.application.name=core-api
server.port=${CORE_API_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.datasource.url=${CORE_API_MYSQL_URL:jdbc:mysql://localhost:3306/batch_core}
spring.datasource.username=${CORE_API_MYSQL_USERNAME:batch_core}
spring.datasource.password=${CORE_API_MYSQL_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${CORE_API_SESSION_TIMEOUT:12h}
server.servlet.session.cookie.name=BATCH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CORE_API_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:batch}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:change-me}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.messaging.exchange=${RABBITMQ_COMMAND_EXCHANGE:batch.commands.v1}
app.messaging.outbox-delay=${CORE_API_OUTBOX_DELAY:1s}

app.auth.bcrypt-strength=${CORE_API_BCRYPT_STRENGTH:12}
app.auth.verification-ttl=${CORE_API_VERIFICATION_TTL:24h}
app.auth.password-reset-ttl=${CORE_API_PASSWORD_RESET_TTL:30m}
app.auth.bootstrap-admin-username=${CORE_API_ADMIN_USERNAME:}
app.auth.bootstrap-admin-email=${CORE_API_ADMIN_EMAIL:admin@localhost.invalid}
app.auth.bootstrap-admin-password-hash=${CORE_API_ADMIN_PASSWORD_HASH:}
app.security.require-https=${CORE_API_REQUIRE_HTTPS:true}
app.scraper-api-url=${CORE_API_SCRAPER_API_URL:http://scraper-api:8000}
app.url-protection-secret=${SCRAPER_URL_PROTECTION_SECRET:}
app.download.max-apps=${DOWNLOAD_MAX_APPS:100}
app.download.max-file-bytes=${DOWNLOAD_MAX_FILE_BYTES:4294967296}
app.download.max-job-bytes=${DOWNLOAD_MAX_JOB_BYTES:21474836480}
app.download.max-parallel=${DOWNLOAD_MAX_PARALLEL:8}
app.download.zip-retention=${DOWNLOAD_ZIP_RETENTION:24h}
app.download.presigned-url-ttl=${DOWNLOAD_PRESIGNED_URL_TTL:5m}
app.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:batch}
app.minio.secret-key=${MINIO_SECRET_KEY:change-me}
app.minio.bucket=${MINIO_ZIP_BUCKET:batch-zips}
