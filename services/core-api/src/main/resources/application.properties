spring.application.name=core-api
server.port=${CORE_API_SERVER_PORT}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

server.tomcat.threads.max=64
server.tomcat.threads.min-spare=8
server.tomcat.max-connections=512
server.tomcat.accept-count=128
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=${CORE_API_DB_POOL_MIN}
spring.datasource.hikari.maximum-pool-size=${CORE_API_DB_POOL_MAX}
spring.datasource.hikari.connection-timeout=${CORE_API_DB_POOL_TIMEOUT}
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${CORE_API_SESSION_TIMEOUT}
server.servlet.session.cookie.name=BATCH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CORE_API_COOKIE_SECURE}
server.servlet.session.cookie.same-site=lax

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.messaging.exchange=${RABBITMQ_COMMAND_EXCHANGE}
app.messaging.events-exchange=${RABBITMQ_EVENT_EXCHANGE}
app.messaging.download-events-queue=${CORE_API_DOWNLOAD_EVENTS_QUEUE}
app.messaging.outbox-delay=${CORE_API_OUTBOX_DELAY}
app.messaging.outbox-claim-lease=${CORE_API_OUTBOX_CLAIM_LEASE}
app.messaging.outbox-confirm-timeout=${CORE_API_OUTBOX_CONFIRM_TIMEOUT}
app.retention.interval=${CORE_API_RETENTION_INTERVAL:PT6H}

app.auth.bcrypt-strength=${CORE_API_BCRYPT_STRENGTH}
app.auth.hash-concurrency=${CORE_API_AUTH_HASH_CONCURRENCY}
app.auth.hash-queue=${CORE_API_AUTH_HASH_QUEUE}
app.auth.hash-wait=${CORE_API_AUTH_HASH_WAIT}
app.auth.login-max-per-minute=${CORE_API_AUTH_LOGIN_MAX_PER_MINUTE}
app.auth.register-max-per-hour=${CORE_API_AUTH_REGISTER_MAX_PER_HOUR}
app.auth.reset-max-per-hour=${CORE_API_AUTH_RESET_MAX_PER_HOUR}
app.auth.verification-resend-max-per-hour=${CORE_API_AUTH_VERIFICATION_RESEND_MAX_PER_HOUR}
app.auth.verification-ttl=${CORE_API_VERIFICATION_TTL}
app.auth.password-reset-ttl=${CORE_API_PASSWORD_RESET_TTL}
app.auth.bootstrap-admin-username=${CORE_API_ADMIN_USERNAME}
app.auth.bootstrap-admin-email=${CORE_API_ADMIN_EMAIL}
app.auth.bootstrap-admin-password=${CORE_API_ADMIN_PASSWORD}
app.public-base-url=${APP_PUBLIC_BASE_URL}
app.notification-token-encryption-key=${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
app.security.require-https=${CORE_API_REQUIRE_HTTPS}

app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.oauth.google.redirect-uri=${APP_PUBLIC_BASE_URL}/api/v1/auth/oauth2/callback/{registrationId}
app.scraper-api-url=${CORE_API_SCRAPER_API_URL}
app.scraper-internal-service-token=${SCRAPER_INTERNAL_SERVICE_TOKEN}
app.semantic-service-url=${CORE_API_SEMANTIC_SERVICE_URL}
app.semantic-internal-service-token=${SCRAPER_INTERNAL_SERVICE_TOKEN}
app.semantic-request-timeout=${CORE_API_SEMANTIC_REQUEST_TIMEOUT}
app.semantic-admin-request-timeout=${CORE_API_SEMANTIC_ADMIN_REQUEST_TIMEOUT}
app.url-protection-secret=${SCRAPER_URL_PROTECTION_SECRET}
app.download.max-apps=${DOWNLOAD_MAX_APPS}
app.download.zip-retention=${DOWNLOAD_ZIP_RETENTION}
app.download.presigned-url-ttl=${DOWNLOAD_PRESIGNED_URL_TTL}
app.download.anonymous-owner-secret=${CORE_API_DOWNLOAD_OWNER_SECRET}
app.download.anonymous-cookie-secure=${CORE_API_COOKIE_SECURE}
app.download.anonymous-max-active-jobs=${DOWNLOAD_ANONYMOUS_MAX_ACTIVE_JOBS}
app.download.anonymous-max-creates-per-hour=${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR}
app.download.anonymous-max-creates-per-ip-hour=${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR}
app.download.authenticated-max-active-jobs=${DOWNLOAD_AUTHENTICATED_MAX_ACTIVE_JOBS}
app.download.global-max-pending-jobs=${DOWNLOAD_GLOBAL_MAX_PENDING_JOBS}
app.download.sse-heartbeat=${DOWNLOAD_SSE_HEARTBEAT}
app.download.worker-capacity-url=${CORE_API_DOWNLOAD_WORKER_URL}
app.download.worker-capacity-timeout=${CORE_API_DOWNLOAD_WORKER_CAPACITY_TIMEOUT}
app.catalog.cache-maximum-size=${CORE_API_CATALOG_CACHE_MAXIMUM_SIZE}
app.catalog.cache-ttl=${CORE_API_CATALOG_CACHE_TTL}
app.minio.endpoint=${MINIO_ENDPOINT}
app.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
app.minio.access-key=${MINIO_ROOT_USER}
app.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.minio.bucket=${MINIO_ZIP_BUCKET}
app.minio.region=${MINIO_REGION}
