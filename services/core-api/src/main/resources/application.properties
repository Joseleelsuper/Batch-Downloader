spring.application.name=core-api
server.port=${CORE_API_SERVER_PORT}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${CORE_API_SESSION_TIMEOUT}
server.servlet.session.cookie.name=BATCH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CORE_API_COOKIE_SECURE}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.messaging.exchange=${RABBITMQ_COMMAND_EXCHANGE}
app.messaging.events-exchange=${RABBITMQ_EVENT_EXCHANGE}
app.messaging.download-events-queue=${CORE_API_DOWNLOAD_EVENTS_QUEUE}
app.messaging.outbox-delay=${CORE_API_OUTBOX_DELAY}

app.auth.bcrypt-strength=${CORE_API_BCRYPT_STRENGTH}
app.auth.verification-ttl=${CORE_API_VERIFICATION_TTL}
app.auth.password-reset-ttl=${CORE_API_PASSWORD_RESET_TTL}
app.auth.bootstrap-admin-username=${CORE_API_ADMIN_USERNAME}
app.auth.bootstrap-admin-email=${CORE_API_ADMIN_EMAIL}
app.auth.bootstrap-admin-password-hash=${CORE_API_ADMIN_PASSWORD_HASH}
app.security.require-https=${CORE_API_REQUIRE_HTTPS}
app.scraper-api-url=${CORE_API_SCRAPER_API_URL}
app.scraper-internal-service-token=${SCRAPPER_INTERNAL_SERVICE_TOKEN}
app.semantic-service-url=${CORE_API_SEMANTIC_SERVICE_URL}
app.semantic-internal-service-token=${SCRAPPER_INTERNAL_SERVICE_TOKEN}
app.semantic-request-timeout=${CORE_API_SEMANTIC_REQUEST_TIMEOUT}
app.semantic-admin-request-timeout=${CORE_API_SEMANTIC_ADMIN_REQUEST_TIMEOUT}
app.url-protection-secret=${SCRAPPER_URL_PROTECTION_SECRET}
app.download.max-apps=${DOWNLOAD_MAX_APPS}
app.download.zip-retention=${DOWNLOAD_ZIP_RETENTION}
app.download.presigned-url-ttl=${DOWNLOAD_PRESIGNED_URL_TTL}
app.download.anonymous-owner-secret=${CORE_API_DOWNLOAD_OWNER_SECRET}
app.download.anonymous-cookie-secure=${CORE_API_COOKIE_SECURE}
app.download.anonymous-max-active-jobs=${DOWNLOAD_ANONYMOUS_MAX_ACTIVE_JOBS}
app.download.anonymous-max-creates-per-hour=${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR}
app.download.anonymous-max-creates-per-ip-hour=${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR}
app.minio.endpoint=${MINIO_ENDPOINT}
app.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
app.minio.access-key=${MINIO_ROOT_USER}
app.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.minio.bucket=${MINIO_ZIP_BUCKET}
app.minio.region=${MINIO_REGION}
