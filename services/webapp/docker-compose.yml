services:
  webapp:
    build:
      context: ../..
      dockerfile: services/webapp/Dockerfile
    cpu_shares: 1024
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBAPP_HOST_PORT:?}:80"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
