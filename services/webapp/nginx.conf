user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream core_api {
    server core-api:8080;
    keepalive 128;
  }

  upstream translation_service {
    server translation-service:8080;
    keepalive 4;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_real_ip $forwarded_real_ip {
    default $http_x_real_ip;
    '' $remote_addr;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"webapp"}\n';
    }

    location = /openapi.yaml {
      default_type application/yaml;
      try_files $uri =404;
    }

    location = /api/v1/locales/es {
      proxy_pass http://translation_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/api/v1/download-jobs/[^/]+/events$ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 35m;
      proxy_send_timeout 35m;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-cache, no-store" always;
    }

    location = /api/v1/catalog/ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Coolify's Traefik terminates TLS before this container. Preserve the
      # secure scheme during WebSocket upgrades to avoid an HTTPS redirect loop.
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 35m;
    }

    location = /api/v1/admin/scraper/ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Coolify's Traefik terminates TLS before this container. Preserve the
      # secure scheme during WebSocket upgrades to avoid an HTTPS redirect loop.
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 35m;
    }

    location ~ ^/api/v1/download-jobs/[^/]+/file$ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 5m;
      send_timeout 5m;
      add_header X-Accel-Buffering no always;
    }

    location /api/ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_max_temp_file_size 0;
    }

    location ~* "^/assets/.*-[a-zA-Z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp)$" {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /__frontend_head {
      internal;
      alias /usr/share/nginx/html/_seo/head.html;
      ssi off;
    }

    location ^~ /_seo/ { return 404; }

    location /assets/ { try_files $uri =404; }
    location /css/ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location = /index.html { return 308 /; }

    location ~ ^/(?:login|admin|dashboard|profile|error)(?:/|$) {
      rewrite ^ /index.html break;
      add_header X-Robots-Tag "noindex, follow" always;
      add_header Cache-Control "no-store" always;
    }

    location = /social/card.png {
      proxy_pass http://core_api/api/v1/seo/image;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Cookie "";
      proxy_cache off;
    }

    location = /robots.txt {
      proxy_pass http://core_api/api/v1/seo/robots.txt;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Cookie "";
    }

    location = /sitemap.xml {
      proxy_pass http://core_api/api/v1/seo/sitemap.xml;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Cookie "";
    }

    location ^~ /sitemap/ {
      proxy_pass http://core_api/api/v1/seo/sitemap/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Cookie "";
    }

    location / {
      # Core renders public content/status; Vite assets come from this image via SSI.
      # Preserve the original URI in a replaced header, never concatenate its query.
      rewrite ^ /api/v1/seo/html? break;
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Accept-Encoding "";
      proxy_intercept_errors off;
      proxy_cache off;
      ssi on;
      ssi_last_modified off;
      etag off;
      if_modified_since off;
      add_header Cache-Control "no-store" always;
    }
  }

  # Hostname dedicado para URLs S3 firmadas. En producción, TLS termina en el
  # proxy frontal y MINIO_PUBLIC_ENDPOINT usa ese hostname HTTPS.
  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"download-proxy"}\n';
    }

    location ~ ^/[^/]+/jobs/[0-9a-fA-F-]+/bundle\.zip$ {
      limit_except GET { deny all; }
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $forwarded_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_force_ranges on;
      proxy_read_timeout 6h;
      proxy_send_timeout 6h;
    }

    location / { return 404; }
  }
}
