user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  limit_conn_zone $server_name zone=download_transfers:10m;

  upstream core_api {
    server core-api:8080;
    keepalive 128;
  }

  upstream translation_service {
    server translation-service:8080;
    keepalive 4;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"webapp"}\n';
    }

    location = /api/v1/locales/es {
      proxy_pass http://translation_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/download-jobs/[^/]+/events$ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 35m;
      proxy_send_timeout 35m;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-cache, no-store" always;
    }

    location = /api/v1/catalog/ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 35m;
    }

    location = /api/v1/admin/scraper/ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 35m;
    }

    location /api/ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* "^/assets/.*-[a-zA-Z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp)$" {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # Hostname dedicado para URLs S3 firmadas. En producción, TLS termina en el
  # proxy frontal y MINIO_PUBLIC_ENDPOINT usa ese hostname HTTPS.
  server {
    listen 8080;
    server_name _;

    location ~ ^/[^/]+/jobs/[0-9a-fA-F-]+/bundle\.zip$ {
      limit_except GET { deny all; }
      limit_conn download_transfers 64;
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_force_ranges on;
      proxy_read_timeout 6h;
      proxy_send_timeout 6h;
    }

    location / { return 404; }
  }
}
