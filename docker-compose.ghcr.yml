  postgres_data:
  rabbitmq_data:
  minio_data:
  notification_service_data:
  download_worker_data:
  download_worker_temp:
  semantic_models:
    name: ${SEMANTIC_MODELS_VOLUME_NAME:?}

configs:
  rabbitmq_enabled_plugins:
    content: "[rabbitmq_management,rabbitmq_prometheus]."
  rabbitmq_privacy_healthcheck:
    content: |
      #!/bin/sh
      set -eu
      rabbitmq-diagnostics -q check_running
      rabbitmq-diagnostics -q check_local_alarms
      if [ ! -f /tmp/batch-downloader-privacy-policies ]; then
        rabbitmqctl -q set_policy --priority 10 --apply-to queues access-mail-retention '^notification\.email-requests\.v1$$' '{"message-ttl":900000}'
        rabbitmqctl -q set_policy --priority 10 --apply-to queues dead-letter-retention '\.dlq(\.|$$)' '{"message-ttl":86280000}'
        rabbitmqctl -q set_policy --priority 20 --apply-to queues access-mail-dead-letter-retention '^notification\.email-requests\.dlq\.v1$$' '{"message-ttl":60000}'
        touch /tmp/batch-downloader-privacy-policies
      fi
  minio_init:
    content: |
      #!/bin/sh
      set -eu

      render_policy() {
        input_path=$$1
        output_path=$$2
        : > "$$output_path"
        while IFS= read -r line || [ -n "$$line" ]; do
          case $$line in
            *"__BUCKET__"*)
              prefix=$${line%%__BUCKET__*}
              suffix=$${line#*__BUCKET__}
              printf '%s%s%s\n' "$$prefix" "$$MINIO_ZIP_BUCKET" "$$suffix" >> "$$output_path"
              ;;
            *)
              printf '%s\n' "$$line" >> "$$output_path"
              ;;
          esac
        done < "$$input_path"
      }

      attempts=0
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        attempts=$$((attempts + 1))
        if [ "$$attempts" -ge 30 ]; then
          echo 'MinIO no está disponible para inicialización.' >&2
          exit 1
        fi
        sleep 2
      done

      mc mb --ignore-existing "local/$$MINIO_ZIP_BUCKET"
      mc ilm rule import "local/$$MINIO_ZIP_BUCKET" < /config/lifecycle-zips.json
      mc quota set "local/$$MINIO_ZIP_BUCKET" --size "$$MINIO_ZIP_QUOTA"
      render_policy /config/core-policy.json /tmp/core-policy.json
      render_policy /config/worker-policy.json /tmp/worker-policy.json
      mc admin policy create local batch-core /tmp/core-policy.json
      mc admin policy create local batch-worker /tmp/worker-policy.json
      mc admin user add local "$$MINIO_CORE_ACCESS_KEY" "$$MINIO_CORE_SECRET_KEY"
      mc admin user add local "$$MINIO_WORKER_ACCESS_KEY" "$$MINIO_WORKER_SECRET_KEY"
      mc admin policy attach local batch-core --user "$$MINIO_CORE_ACCESS_KEY"
      mc admin policy attach local batch-worker --user "$$MINIO_WORKER_ACCESS_KEY"
  minio_lifecycle:
    content: |
      {
        "Rules": [
          {
            "ID": "expire-download-jobs-after-24h",
            "Status": "Disabled",
            "Filter": {"Prefix": "jobs/"},
            "Expiration": {"Days": 1}
          }
        ]
      }
  minio_core_policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::__BUCKET__"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket"],
            "Resource": ["arn:aws:s3:::__BUCKET__"],
            "Condition": {"StringLike": {"s3:prefix": ["jobs/*"]}}
          },
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:DeleteObject"],
            "Resource": ["arn:aws:s3:::__BUCKET__/jobs/*"]
          }
        ]
      }
  minio_worker_policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads"],
            "Resource": ["arn:aws:s3:::__BUCKET__"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
            "Resource": ["arn:aws:s3:::__BUCKET__/jobs/*"]
          }
        ]
      }
