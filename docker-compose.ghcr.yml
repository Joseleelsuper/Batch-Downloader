name: batch-downloader

services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1", "--max-connections=20", "--long-query-time=0.5"]
    cpu_shares: 1024
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=20"]
    cpu_shares: 512
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    cpu_shares: 1024
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    cpu_shares: 1024
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/zips;
      mc ilm import local/zips < /config/lifecycle-zips.json;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/minio/lifecycle-zips.json:/config/lifecycle-zips.json:ro

  scraper-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./api/scraper/.env.example
      - path: ./api/scraper/.env
        required: false
    environment:
      SCRAPPER_DATABASE_HOST: mysql
      SCRAPPER_DATABASE_PORT: 3306
      SCRAPPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
      SCRAPPER_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
    cpu_shares: 512
    ports:
      - "${SCRAPPER_API_HOST_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  scraper-scheduler:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["scheduler"]
    env_file:
      - path: ./api/scraper/.env.scheduler.example
      - path: ./api/scraper/.env.scheduler
        required: false
    environment:
      SCRAPPER_DATABASE_HOST: mysql
      SCRAPPER_DATABASE_PORT: 3306
      SCRAPPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
    cpu_shares: 256
    depends_on:
      scraper-api:
        condition: service_healthy

  webapp:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-webapp:${GHCR_IMAGE_TAG}
    cpu_shares: 1024
    pull_policy: always
    ports:
      - "${WEBAPP_HOST_PORT}:80"
    depends_on:
      core-api:
        condition: service_started

  core-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-core-api:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./services/core-api/.env.example
      - path: ./services/core-api/.env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CORE_API_ADMIN_USERNAME: ${CORE_API_ADMIN_USERNAME}
      CORE_API_ADMIN_EMAIL: ${CORE_API_ADMIN_EMAIL}
      CORE_API_ADMIN_PASSWORD: ${CORE_API_ADMIN_PASSWORD}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
      SCRAPPER_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      CORE_API_DOWNLOAD_OWNER_SECRET: ${CORE_API_DOWNLOAD_OWNER_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
    cpu_shares: 1024
    ports:
      - "${CORE_API_HOST_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
      semantic-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  semantic-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./services/semantic-service/.env.example
      - path: ./services/semantic-service/.env
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
    cpu_shares: 512
    ports:
      - "${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/semantic/health', timeout=3)); assert data['database']",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  semantic-indexer:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.indexer", "--loop"]
    env_file:
      - path: ./services/semantic-service/.env.indexer.example
      - path: ./services/semantic-service/.env.indexer
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    restart: unless-stopped

  semantic-model-worker:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.model_worker"]
    env_file:
      - path: ./services/semantic-service/.env.model-worker.example
      - path: ./services/semantic-service/.env.model-worker
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_SERVICE_URL: http://semantic-service:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    restart: unless-stopped

  semantic-trainer:
    profiles: ["training"]
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.trainer"]
    env_file:
      - path: ./services/semantic-service/.env.trainer.example
      - path: ./services/semantic-service/.env.trainer
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports

  mailpit:
    image: axllent/mailpit:v1.30.0
    cpu_shares: 128
    ports:
      - "${MAILPIT_SMTP_HOST_PORT}:1025"
      - "${MAILPIT_UI_HOST_PORT}:8025"

  notification-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-notification-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./services/notification-service/.env.example
      - path: ./services/notification-service/.env
        required: false
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      NOTIFICATION_SERVICE_INBOX_PASSWORD: ${NOTIFICATION_SERVICE_INBOX_PASSWORD}
      NOTIFICATION_SERVICE_SMTP_USERNAME: ${NOTIFICATION_SERVICE_SMTP_USERNAME}
      NOTIFICATION_SERVICE_SMTP_PASSWORD: ${NOTIFICATION_SERVICE_SMTP_PASSWORD}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
    cpu_shares: 256
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - notification_service_data:/app/data

  download-worker:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-download-worker:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./services/download-worker/.env.example
      - path: ./services/download-worker/.env
        required: false
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DOWNLOAD_WORKER_INBOX_PASSWORD: ${DOWNLOAD_WORKER_INBOX_PASSWORD}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      SCRAPPER_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
    cpu_shares: 768
    ports:
      - "${DOWNLOAD_WORKER_HOST_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      core-api:
        condition: service_started
    volumes:
      - download_worker_data:/app/data

  translation-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-translation-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    env_file:
      - path: ./services/translation-service/.env.example
      - path: ./services/translation-service/.env
        required: false
    cpu_shares: 128
    ports:
      - "${TRANSLATION_SERVICE_HOST_PORT}:8080"

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  minio_data:
  notification_service_data:
  download_worker_data:
  semantic_models:
  semantic_reports:
