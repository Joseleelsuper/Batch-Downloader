name: batch-downloader

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--skip-log-bin", "--log-bin-trust-function-creators=1", "--max-connections=32", "--long-query-time=0.5", "--binlog-expire-logs-seconds=86400"]
    cpu_shares: 1024
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -D $${MYSQL_DATABASE} --silent --skip-column-names -e 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=20"]
    cpu_shares: 512
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    cpu_shares: 1024
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    cpu_shares: 1024
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_STALE_UPLOADS_EXPIRY}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_STALE_UPLOADS_CLEANUP_INTERVAL}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/cluster >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      MINIO_ZIP_QUOTA: ${MINIO_ZIP_QUOTA}
      MINIO_CORE_ACCESS_KEY: ${MINIO_CORE_ACCESS_KEY}
      MINIO_CORE_SECRET_KEY: ${MINIO_CORE_SECRET_KEY}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
    configs:
      - source: minio_init
        target: /config/init.sh
        mode: 0555
      - source: minio_lifecycle
        target: /config/lifecycle-zips.json
      - source: minio_core_policy
        target: /config/core-policy.json
      - source: minio_worker_policy
        target: /config/worker-policy.json

  scraper-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./api/scraper/.env.example
      - path: ./api/scraper/.env
        required: false
    environment:
      SCRAPER_DATABASE_HOST: mysql
      SCRAPER_DATABASE_PORT: 3306
      SCRAPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPER_DATABASE_POOL_MAX: 4
      SCRAPER_DATABASE_MAX_OVERFLOW: 2
      SCRAPER_ALEMBIC_TARGET: ${SCRAPER_ALEMBIC_TARGET:-20260914_0021}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET}
      SCRAPER_LLM_GROQ_API_KEY: ${SCRAPER_LLM_GROQ_API_KEY}
      SCRAPER_LLM_DEEPSEEK_API_KEY: ${SCRAPER_LLM_DEEPSEEK_API_KEY}
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
    cpu_shares: 512
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  scraper-scheduler:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    command: ["scheduler"]
    env_file:
      - path: ./api/scraper/.env
        required: false
    environment:
      SCRAPER_DATABASE_HOST: mysql
      SCRAPER_DATABASE_PORT: 3306
      SCRAPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPER_DATABASE_POOL_MAX: 8
      SCRAPER_DATABASE_MAX_OVERFLOW: 4
      SCRAPER_ALEMBIC_TARGET: ${SCRAPER_ALEMBIC_TARGET:-20260914_0021}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET}
      SCRAPER_LLM_GROQ_API_KEY: ${SCRAPER_LLM_GROQ_API_KEY}
      SCRAPER_LLM_DEEPSEEK_API_KEY: ${SCRAPER_LLM_DEEPSEEK_API_KEY}
    cpu_shares: 256
    restart: unless-stopped
    depends_on:
      scraper-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  webapp:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-webapp:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    cpu_shares: 1024
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${WEBAPP_HOST_PORT}:80"
      - "127.0.0.1:${MINIO_DOWNLOAD_HOST_PORT}:8080"
    depends_on:
      core-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  core-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-core-api:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./services/core-api/.env.example
      - path: ./services/core-api/.env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CORE_API_SERVER_PORT: 8080
      CORE_API_SCRAPER_API_URL: http://scraper-api:8000
      CORE_API_SEMANTIC_SERVICE_URL: http://semantic-service:8000
      CORE_API_DOWNLOAD_WORKER_URL: http://download-worker:8080
      CORE_API_DOWNLOAD_WORKER_CAPACITY_TIMEOUT: 1s
      CORE_API_SEMANTIC_REQUEST_TIMEOUT: 3s
      CORE_API_BCRYPT_STRENGTH: 12
      CORE_API_DB_POOL_MIN: 2
      CORE_API_DB_POOL_MAX: 5
      CORE_API_DB_POOL_TIMEOUT: 2000
      CORE_API_FLYWAY_TARGET: ${CORE_API_FLYWAY_TARGET:-19}
      CORE_API_AUTH_HASH_CONCURRENCY: 2
      CORE_API_AUTH_HASH_QUEUE: 20
      CORE_API_AUTH_HASH_WAIT: 2s
      CORE_API_AUTH_LOGIN_MAX_PER_MINUTE: 10
      CORE_API_AUTH_MAGIC_LINK_MAX_PER_EMAIL_HOUR: 3
      CORE_API_AUTH_MAGIC_LINK_MAX_PER_IP_HOUR: 20
      CORE_API_SESSION_TIMEOUT: 8h
      CORE_API_MAGIC_LINK_TTL: 15m
      CORE_API_MAGIC_LINK_PENDING_CLEANUP_INTERVAL: 1m
      CORE_API_OUTBOX_DELAY: 1s
      CORE_API_OUTBOX_CLAIM_LEASE: 5m
      CORE_API_OUTBOX_CONFIRM_TIMEOUT: 2s
      CORE_API_RETENTION_INTERVAL: 6h
      CORE_API_ADMIN_USERNAME: ${CORE_API_ADMIN_USERNAME}
      CORE_API_ADMIN_EMAIL: ${CORE_API_ADMIN_EMAIL}
      CORE_API_ADMIN_PASSWORD: ${CORE_API_ADMIN_PASSWORD}
      CORE_API_REQUIRE_HTTPS: ${CORE_API_REQUIRE_HTTPS:-false}
      CORE_API_COOKIE_SECURE: ${CORE_API_COOKIE_SECURE:-false}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET}
      CORE_API_DOWNLOAD_OWNER_SECRET: ${CORE_API_DOWNLOAD_OWNER_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_CORE_ACCESS_KEY: ${MINIO_CORE_ACCESS_KEY}
      MINIO_CORE_SECRET_KEY: ${MINIO_CORE_SECRET_KEY}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      DOWNLOAD_MAX_APPS: 100
      DOWNLOAD_ZIP_RETENTION: 6h
      DOWNLOAD_PRESIGNED_URL_TTL: 5m
      DOWNLOAD_ANONYMOUS_MAX_ACTIVE_JOBS: 2
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR: 10
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR: 30
      DOWNLOAD_AUTHENTICATED_MAX_ACTIVE_JOBS: 3
      DOWNLOAD_GLOBAL_MAX_PENDING_JOBS: 50
      DOWNLOAD_SSE_HEARTBEAT: 20s
      CORE_API_CATALOG_CACHE_MAXIMUM_SIZE: 512
      CORE_API_CATALOG_CACHE_TTL: 15s
      CORE_API_DOWNLOAD_EVENTS_QUEUE: core-api.download.events.v1
    cpu_shares: 1024
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_API_HOST_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  semantic-migrate:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    command: ["python", "-m", "app.migrator"]
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  semantic-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./services/semantic-service/.env.example
      - path: ./services/semantic-service/.env
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_DIR: /models/current
      SEMANTIC_MODEL_RUNTIME_CACHE_DIR: /models/runtime-cache
      SEMANTIC_MODEL_MANIFEST_NAME: batch-model.json
    cpu_shares: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      semantic-migrate:
        condition: service_completed_successfully
    volumes:
      - semantic_models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/semantic/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  semantic-indexer:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    command: ["python", "-m", "app.indexer", "--loop"]
    env_file:
      - path: ./services/semantic-service/.env.indexer.example
      - path: ./services/semantic-service/.env.indexer
        required: false
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_DIR: /models/current
      SEMANTIC_MODEL_RUNTIME_CACHE_DIR: /models/runtime-cache
      SEMANTIC_MODEL_MANIFEST_NAME: batch-model.json
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "indexer", "--writable", "/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  notification-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-notification-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./services/notification-service/.env.example
      - path: ./services/notification-service/.env
        required: false
    environment:
      NOTIFICATION_SERVICE_SERVER_PORT: 8080
      NOTIFICATION_RETRY_MAX_ATTEMPTS: 3
      NOTIFICATION_RETRY_INITIAL_INTERVAL: 1s
      NOTIFICATION_RETRY_MULTIPLIER: 2
      NOTIFICATION_RETRY_MAX_INTERVAL: 10s
      NOTIFICATION_SERVICE_INBOX_URL: jdbc:h2:file:/app/data/notification-inbox;DB_CLOSE_ON_EXIT=FALSE
      NOTIFICATION_SERVICE_INBOX_USERNAME: sa
      NOTIFICATION_SERVICE_INBOX_LEASE_DURATION: PT5M
      NOTIFICATION_SERVICE_RETENTION_INTERVAL: 6h
      NOTIFICATION_SERVICE_HEARTBEAT_INTERVAL: 10s
      NOTIFICATION_SERVICE_HEARTBEAT_STALE_AFTER: 1m
      NOTIFICATION_SERVICE_TRANSLATION_URL: http://translation-service:8080
      NOTIFICATION_SERVICE_TRANSLATION_CONNECT_TIMEOUT: 2s
      NOTIFICATION_SERVICE_TRANSLATION_REQUEST_TIMEOUT: 5s
      NOTIFICATION_SERVICE_TRANSLATION_CACHE_TTL: 5m
      NOTIFICATION_SERVICE_TRANSLATION_FALLBACK_LOCALE: es
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      NOTIFICATION_SERVICE_RESEND_BASE_URL: https://api.resend.com
      NOTIFICATION_SERVICE_RESEND_CONNECT_TIMEOUT: 2s
      NOTIFICATION_SERVICE_RESEND_REQUEST_TIMEOUT: 10s
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      NOTIFICATION_MAIL_LOGO_URL: ${NOTIFICATION_MAIL_LOGO_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY}
    cpu_shares: 256
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_HOST_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      translation-service:
        condition: service_healthy
    volumes:
      - notification_service_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  download-worker:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-download-worker:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./services/download-worker/.env.example
      - path: ./services/download-worker/.env
        required: false
    environment:
      DOWNLOAD_WORKER_SERVER_PORT: 8080
      DOWNLOAD_WORKER_INBOX_URL: jdbc:h2:file:/app/data/download-inbox;DB_CLOSE_ON_EXIT=FALSE
      DOWNLOAD_WORKER_INBOX_USERNAME: sa
      DOWNLOAD_WORKER_COMMAND_EXCHANGE: batch.commands.v1
      DOWNLOAD_WORKER_EVENT_EXCHANGE: batch.events.v1
      DOWNLOAD_WORKER_INPUT_ROUTING_KEY: download.job.requested
      DOWNLOAD_WORKER_INPUT_QUEUE: download-worker.download.job.requested.v1
      DOWNLOAD_WORKER_CANCELLATION_ROUTING_KEY: download.job.cancel-requested
      DOWNLOAD_WORKER_SOURCE_RESOLVER_URL: http://scraper-api:8000
      DOWNLOAD_WORKER_CORE_API_URL: http://core-api:8080
      DOWNLOAD_WORKER_CANCELLATION_QUEUE: download-worker.download.job.cancel-requested.v1
      DOWNLOAD_WORKER_DLX: batch.dead-letter.v1
      DOWNLOAD_WORKER_DLQ: download-worker.download.job.requested.v1.dlq
      DOWNLOAD_WORKER_CAPACITY_WAIT_QUEUE: download-worker.download.job.capacity-wait.v1
      DOWNLOAD_WORKER_CAPACITY_WAIT_DELAY: 30s
      DOWNLOAD_WORKER_CANCELLATION_CONCURRENCY: 2
      DOWNLOAD_WORKER_RETRY_ATTEMPTS: 3
      DOWNLOAD_WORKER_RETRY_INITIAL_INTERVAL: 1s
      DOWNLOAD_WORKER_RETRY_MULTIPLIER: "2.0"
      DOWNLOAD_WORKER_RETRY_MAX_INTERVAL: 10s
      DOWNLOAD_WORKER_ARTIFACT_RETENTION: 6h
      DOWNLOAD_WORKER_SOURCE_RESOLVER_TIMEOUT: 10s
      DOWNLOAD_WORKER_CORE_API_TIMEOUT: 10s
      DOWNLOAD_WORKER_MAX_ITEMS: 100
      DOWNLOAD_WORKER_MAX_FILE_SIZE: 4GB
      DOWNLOAD_WORKER_MAX_REDIRECTS: 5
      DOWNLOAD_WORKER_CONNECT_TIMEOUT: 10s
      DOWNLOAD_WORKER_REQUEST_TIMEOUT: 15m
      DOWNLOAD_WORKER_CONCURRENCY: 16
      DOWNLOAD_WORKER_JOB_CONCURRENCY: 8
      DOWNLOAD_WORKER_PER_JOB_CONCURRENCY: 2
      DOWNLOAD_WORKER_PACKAGING_CONCURRENCY: 4
      DOWNLOAD_WORKER_ZIP_LEVEL: 0
      DOWNLOAD_WORKER_LARGE_JOB_THRESHOLD: 2GB
      DOWNLOAD_WORKER_MULTIPART_PART_SIZE: 16MB
      DOWNLOAD_WORKER_INBOX_LEASE: 30m
      DOWNLOAD_WORKER_RETENTION_INTERVAL: 6h
      DOWNLOAD_WORKER_HEARTBEAT_INTERVAL: 10s
      DOWNLOAD_WORKER_HEARTBEAT_STALE_AFTER: 1m
      DOWNLOAD_WORKER_TEMP_DIRECTORY: /tmp/batch-downloader
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      MINIO_ZIP_QUOTA: ${MINIO_ZIP_QUOTA}
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN}
      DOWNLOAD_WORKER_LINUX_INSTALLER_ENABLED: ${DOWNLOAD_WORKER_LINUX_INSTALLER_ENABLED:-true}
      DOWNLOAD_WORKER_MAX_TOTAL_SIZE: ${DOWNLOAD_WORKER_MAX_TOTAL_SIZE:-20GB}
      DOWNLOAD_WORKER_MIN_FREE_SPACE: ${DOWNLOAD_WORKER_MIN_FREE_SPACE:-30GB}
    cpu_shares: 768
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOWNLOAD_WORKER_HOST_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      core-api:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - download_worker_data:/app/data
      - download_worker_temp:/tmp/batch-downloader
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  translation-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-translation-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - path: ./services/translation-service/.env.example
      - path: ./services/translation-service/.env
        required: false
    environment:
      TRANSLATION_SERVICE_SERVER_PORT: 8080
      TRANSLATION_SERVICE_LOCALES_PATH: /app/locales
      TRANSLATION_SERVICE_CACHE_MAX_AGE: PT1H
    cpu_shares: 128
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRANSLATION_SERVICE_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  minio_data:
  notification_service_data:
  download_worker_data:
  download_worker_temp:
  semantic_models:
    name: ${SEMANTIC_MODELS_VOLUME_NAME:-batch-downloader_semantic_models}

configs:
  rabbitmq_enabled_plugins:
    content: "[rabbitmq_management,rabbitmq_prometheus]."
  minio_init:
    content: |
      #!/bin/sh
      set -eu

      render_policy() {
        input_path=$$1
        output_path=$$2
        : > "$$output_path"
        while IFS= read -r line || [ -n "$$line" ]; do
          case $$line in
            *"__BUCKET__"*)
              prefix=$${line%%__BUCKET__*}
              suffix=$${line#*__BUCKET__}
              printf '%s%s%s\n' "$$prefix" "$$MINIO_ZIP_BUCKET" "$$suffix" >> "$$output_path"
              ;;
            *)
              printf '%s\n' "$$line" >> "$$output_path"
              ;;
          esac
        done < "$$input_path"
      }

      attempts=0
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        attempts=$$((attempts + 1))
        if [ "$$attempts" -ge 30 ]; then
          echo 'MinIO no está disponible para inicialización.' >&2
          exit 1
        fi
        sleep 2
      done

      mc mb --ignore-existing "local/$$MINIO_ZIP_BUCKET"
      mc ilm rule import "local/$$MINIO_ZIP_BUCKET" < /config/lifecycle-zips.json
      mc quota set "local/$$MINIO_ZIP_BUCKET" --size "$$MINIO_ZIP_QUOTA"
      render_policy /config/core-policy.json /tmp/core-policy.json
      render_policy /config/worker-policy.json /tmp/worker-policy.json
      mc admin policy create local batch-core /tmp/core-policy.json
      mc admin policy create local batch-worker /tmp/worker-policy.json
      mc admin user add local "$$MINIO_CORE_ACCESS_KEY" "$$MINIO_CORE_SECRET_KEY"
      mc admin user add local "$$MINIO_WORKER_ACCESS_KEY" "$$MINIO_WORKER_SECRET_KEY"
      mc admin policy attach local batch-core --user "$$MINIO_CORE_ACCESS_KEY"
      mc admin policy attach local batch-worker --user "$$MINIO_WORKER_ACCESS_KEY"
  minio_lifecycle:
    content: |
      {
        "Rules": [
          {
            "ID": "expire-download-jobs-after-24h",
            "Status": "Enabled",
            "Filter": {"Prefix": "jobs/"},
            "Expiration": {"Days": 1}
          }
        ]
      }
  minio_core_policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::__BUCKET__"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket"],
            "Resource": ["arn:aws:s3:::__BUCKET__"],
            "Condition": {"StringLike": {"s3:prefix": ["jobs/*"]}}
          },
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:DeleteObject"],
            "Resource": ["arn:aws:s3:::__BUCKET__/jobs/*"]
          }
        ]
      }
  minio_worker_policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads"],
            "Resource": ["arn:aws:s3:::__BUCKET__"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
            "Resource": ["arn:aws:s3:::__BUCKET__/jobs/*"]
          }
        ]
      }
