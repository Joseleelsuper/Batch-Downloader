name: batch-downloader

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

x-scraper-environment: &scraper-environment
  SCRAPER_APP_NAME: ${SCRAPER_APP_NAME:?}
  SCRAPER_WINSTALL_BASE_URL: ${SCRAPER_WINSTALL_BASE_URL:?}
  SCRAPER_WINSTALL_API_BASE_URL: ${SCRAPER_WINSTALL_API_BASE_URL:?}
  SCRAPER_REQUEST_TIMEOUT_SECONDS: ${SCRAPER_REQUEST_TIMEOUT_SECONDS:?}
  SCRAPER_MAX_REDIRECTS: ${SCRAPER_MAX_REDIRECTS:?}
  SCRAPER_MAX_DOWNLOAD_SIZE_BYTES: ${SCRAPER_MAX_DOWNLOAD_SIZE_BYTES:?}
  SCRAPER_ICON_MAX_BYTES: ${SCRAPER_ICON_MAX_BYTES:?}
  SCRAPER_MANUAL_INSPECTION_TTL_HOURS: ${SCRAPER_MANUAL_INSPECTION_TTL_HOURS:?}
  SCRAPER_MANUAL_INSPECTION_MAX_ATTEMPTS: ${SCRAPER_MANUAL_INSPECTION_MAX_ATTEMPTS:?}
  SCRAPER_MANUAL_PAGE_MAX_BYTES: ${SCRAPER_MANUAL_PAGE_MAX_BYTES:?}
  SCRAPER_SO_FILTER_CONCURRENCY: ${SCRAPER_SO_FILTER_CONCURRENCY:?}
  SCRAPER_SO_FILTER_MAX_ATTEMPTS: ${SCRAPER_SO_FILTER_MAX_ATTEMPTS:?}
  SCRAPER_SCRAPE_CONCURRENCY: ${SCRAPER_SCRAPE_CONCURRENCY:?}
  SCRAPER_CPU_THREAD_WORKERS: ${SCRAPER_CPU_THREAD_WORKERS:?}
  SCRAPER_SCHEDULER_TIMEZONE: ${SCRAPER_SCHEDULER_TIMEZONE:?}
  SCRAPER_SCHEDULER_HOUR: ${SCRAPER_SCHEDULER_HOUR:?}
  SCRAPER_SCHEDULER_MINUTE: ${SCRAPER_SCHEDULER_MINUTE:?}
  SCRAPER_RUN_ON_STARTUP: ${SCRAPER_RUN_ON_STARTUP:?}
  SCRAPER_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${SCRAPER_WORKER_HEARTBEAT_INTERVAL_SECONDS:?}
  SCRAPER_WORKER_HEARTBEAT_STALE_SECONDS: ${SCRAPER_WORKER_HEARTBEAT_STALE_SECONDS:?}
  SCRAPER_WORKER_FAILURE_THRESHOLD: ${SCRAPER_WORKER_FAILURE_THRESHOLD:?}
  SCRAPER_ALLOWED_DOWNLOAD_SCHEMES: ${SCRAPER_ALLOWED_DOWNLOAD_SCHEMES:?}
  SCRAPER_SCRAPE_MAX_APPS: ${SCRAPER_SCRAPE_MAX_APPS:?}
  SCRAPER_SCRAPE_APP_TIMEOUT_SECONDS: ${SCRAPER_SCRAPE_APP_TIMEOUT_SECONDS:?}
  SCRAPER_PLAYWRIGHT_TIMEOUT_MS: ${SCRAPER_PLAYWRIGHT_TIMEOUT_MS:?}
  SCRAPER_LLM_GROQ_BASE_URL: ${SCRAPER_LLM_GROQ_BASE_URL:?}
  SCRAPER_LLM_GROQ_MODEL: ${SCRAPER_LLM_GROQ_MODEL:?}
  SCRAPER_LLM_GROQ_FALLBACK_MODELS: ${SCRAPER_LLM_GROQ_FALLBACK_MODELS:?}
  SCRAPER_LLM_DEEPSEEK_BASE_URL: ${SCRAPER_LLM_DEEPSEEK_BASE_URL:?}
  SCRAPER_LLM_DEEPSEEK_MODEL: ${SCRAPER_LLM_DEEPSEEK_MODEL:?}
  SCRAPER_LLM_MAX_CONCURRENCY: ${SCRAPER_LLM_MAX_CONCURRENCY:?}
  SCRAPER_LLM_MAX_APPS_PER_RUN: ${SCRAPER_LLM_MAX_APPS_PER_RUN:?}
  SCRAPER_LLM_REQUEST_TIMEOUT_SECONDS: ${SCRAPER_LLM_REQUEST_TIMEOUT_SECONDS:?}
  SCRAPER_DATABASE_POOL_TIMEOUT_SECONDS: ${SCRAPER_DATABASE_POOL_TIMEOUT_SECONDS:?}
  SCRAPER_DATABASE_POOL_RECYCLE_SECONDS: ${SCRAPER_DATABASE_POOL_RECYCLE_SECONDS:?}
  SCRAPER_DATABASE_HOST: ${SCRAPER_DATABASE_HOST:?}
  SCRAPER_DATABASE_PORT: ${SCRAPER_DATABASE_PORT:?}
  SCRAPER_DATABASE_NAME: ${MYSQL_DATABASE:?}
  SCRAPER_DATABASE_USERNAME: ${MYSQL_USER:?}
  SCRAPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD:?}
  SCRAPER_LLM_OPENAI_API_KEY: ${SCRAPER_LLM_OPENAI_API_KEY?}
  SCRAPER_LLM_OPENAI_BASE_URL: ${SCRAPER_LLM_OPENAI_BASE_URL:?}
  SCRAPER_LLM_OPENAI_MODEL: ${SCRAPER_LLM_OPENAI_MODEL:?}
  SCRAPER_LLM_GROQ_API_KEY: ${SCRAPER_LLM_GROQ_API_KEY?}
  SCRAPER_LLM_DEEPSEEK_API_KEY: ${SCRAPER_LLM_DEEPSEEK_API_KEY?}

x-semantic-environment: &semantic-environment
  SEMANTIC_MODEL_DIR: ${SEMANTIC_MODEL_DIR:?}
  SEMANTIC_MODEL_RUNTIME_CACHE_DIR: ${SEMANTIC_MODEL_RUNTIME_CACHE_DIR:?}
  SEMANTIC_MODEL_MANIFEST_NAME: ${SEMANTIC_MODEL_MANIFEST_NAME:?}
  SEMANTIC_DEVICE: ${SEMANTIC_DEVICE:?}
  SEMANTIC_CANDIDATE_LIMIT: ${SEMANTIC_CANDIDATE_LIMIT:?}
  SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE:?}
  SEMANTIC_INDEX_INTERVAL_SECONDS: ${SEMANTIC_INDEX_INTERVAL_SECONDS:?}
  SEMANTIC_INDEX_LEASE_SECONDS: ${SEMANTIC_INDEX_LEASE_SECONDS:?}
  SEMANTIC_SEARCH_TIMEOUT_SECONDS: ${SEMANTIC_SEARCH_TIMEOUT_SECONDS:?}
  SEMANTIC_API_DB_POOL_MIN: ${SEMANTIC_API_DB_POOL_MIN:?}
  SEMANTIC_API_DB_POOL_MAX: ${SEMANTIC_API_DB_POOL_MAX:?}
  SEMANTIC_INDEXER_DB_POOL_MIN: ${SEMANTIC_INDEXER_DB_POOL_MIN:?}
  SEMANTIC_INDEXER_DB_POOL_MAX: ${SEMANTIC_INDEXER_DB_POOL_MAX:?}
  SEMANTIC_DB_POOL_TIMEOUT_SECONDS: ${SEMANTIC_DB_POOL_TIMEOUT_SECONDS:?}
  SEMANTIC_DB_POOL_MAX_LIFETIME_SECONDS: ${SEMANTIC_DB_POOL_MAX_LIFETIME_SECONDS:?}
  SEMANTIC_SEARCH_CONCURRENCY: ${SEMANTIC_SEARCH_CONCURRENCY:?}
  SEMANTIC_SEARCH_CAPACITY_WAIT_SECONDS: ${SEMANTIC_SEARCH_CAPACITY_WAIT_SECONDS:?}
  SEMANTIC_BACKGROUND_TIMEZONE: ${SEMANTIC_BACKGROUND_TIMEZONE:?}
  SEMANTIC_BACKGROUND_START_HOUR: ${SEMANTIC_BACKGROUND_START_HOUR:?}
  SEMANTIC_BACKGROUND_END_HOUR: ${SEMANTIC_BACKGROUND_END_HOUR:?}
  SEMANTIC_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${SEMANTIC_WORKER_HEARTBEAT_INTERVAL_SECONDS:?}
  SEMANTIC_WORKER_HEARTBEAT_STALE_SECONDS: ${SEMANTIC_WORKER_HEARTBEAT_STALE_SECONDS:?}
  SEMANTIC_WORKER_FAILURE_THRESHOLD: ${SEMANTIC_WORKER_FAILURE_THRESHOLD:?}
  SEMANTIC_DATABASE_HOST: ${SEMANTIC_DATABASE_HOST:?}
  SEMANTIC_DATABASE_PORT: ${SEMANTIC_DATABASE_PORT:?}
  SEMANTIC_DATABASE_NAME: ${POSTGRES_DB:?}
  SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER:?}
  SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
  SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN?}
  SEMANTIC_SCRAPER_API_URL: ${SEMANTIC_SCRAPER_API_URL:?}
  SEMANTIC_CORE_API_URL: ${SEMANTIC_CORE_API_URL:?}

services:
  java-data-init:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-download-worker:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    entrypoint: ["chown", "-R", "10001:10001", "/worker-inbox", "/worker-temp", "/notification-inbox"]
    volumes:
      - download_worker_data:/worker-inbox
      - download_worker_temp:/worker-temp
      - notification_service_data:/notification-inbox

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    command: ["--skip-log-bin", "--log-bin-trust-function-creators=1", "--max-connections=32", "--long-query-time=0.5", "--binlog-expire-logs-seconds=86400"]
    cpu_shares: 1024
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -D $${MYSQL_DATABASE} --silent --skip-column-names -e 'SELECT 1' | grep -qx 1"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=20"]
    cpu_shares: 512
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' | grep -qx 1"]
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    cpu_shares: 1024
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
        mode: 0444
      - source: rabbitmq_privacy_healthcheck
        target: /etc/rabbitmq/privacy-healthcheck.sh
        mode: 0444
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sh", "/etc/rabbitmq/privacy-healthcheck.sh"]
      timeout: 30s

  minio:
    # Mismo digest de quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z; ver README del worker.
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    cpu_shares: 1024
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:?}
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_STALE_UPLOADS_EXPIRY:?}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_STALE_UPLOADS_CLEANUP_INTERVAL:?}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/cluster >/dev/null"]
      start_period: 30s

  minio-init:
    # La imagen del servidor ya incluye mc RELEASE.2025-04-16T18-13-26Z.
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET:?}
      MINIO_ZIP_QUOTA: ${MINIO_ZIP_QUOTA:?}
      MINIO_CORE_ACCESS_KEY: ${MINIO_CORE_ACCESS_KEY:?}
      MINIO_CORE_SECRET_KEY: ${MINIO_CORE_SECRET_KEY:?}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?}
    configs:
      - source: minio_init
        target: /config/init.sh
        mode: 0555
      - source: minio_lifecycle
        target: /config/lifecycle-zips.json
      - source: minio_core_policy
        target: /config/core-policy.json
      - source: minio_worker_policy
        target: /config/worker-policy.json

  scraper-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    environment:
      <<: *scraper-environment
      SCRAPER_DATABASE_POOL_MAX: ${SCRAPER_API_SCRAPER_DATABASE_POOL_MAX:?}
      SCRAPER_DATABASE_MAX_OVERFLOW: ${SCRAPER_API_SCRAPER_DATABASE_MAX_OVERFLOW:?}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET?}
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN?}
    cpu_shares: 512
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()",
        ]
      start_period: 120s

  scraper-scheduler:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    command: ["scheduler"]
    environment:
      <<: *scraper-environment
      SCRAPER_DATABASE_POOL_MAX: ${SCRAPER_SCHEDULER_SCRAPER_DATABASE_POOL_MAX:?}
      SCRAPER_DATABASE_MAX_OVERFLOW: ${SCRAPER_SCHEDULER_SCRAPER_DATABASE_MAX_OVERFLOW:?}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET?}
    cpus: 1.0
    cpu_shares: 256
    restart: unless-stopped
    depends_on:
      scraper-api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "scheduler"]
      interval: 30s
      retries: 3

  webapp:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-webapp:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    cpu_shares: 1024
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${WEBAPP_HOST_PORT}:80"
      - "127.0.0.1:${MINIO_DOWNLOAD_HOST_PORT}:8080"
    depends_on:
      core-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      retries: 6
      start_period: 20s

  core-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-core-api:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    environment:
      CORE_API_SERVER_PORT: ${CORE_API_SERVER_PORT:?}
      CORE_API_SCRAPER_API_URL: ${CORE_API_SCRAPER_API_URL:?}
      CORE_API_SEMANTIC_SERVICE_URL: ${CORE_API_SEMANTIC_SERVICE_URL:?}
      CORE_API_DOWNLOAD_WORKER_URL: ${CORE_API_DOWNLOAD_WORKER_URL:?}
      CORE_API_SEMANTIC_REQUEST_TIMEOUT: ${CORE_API_SEMANTIC_REQUEST_TIMEOUT:?}
      CORE_API_BCRYPT_STRENGTH: ${CORE_API_BCRYPT_STRENGTH:?}
      CORE_API_DB_POOL_MIN: ${CORE_API_DB_POOL_MIN:?}
      CORE_API_DB_POOL_MAX: ${CORE_API_DB_POOL_MAX:?}
      CORE_API_DB_POOL_TIMEOUT: ${CORE_API_DB_POOL_TIMEOUT:?}
      CORE_API_AUTH_HASH_CONCURRENCY: ${CORE_API_AUTH_HASH_CONCURRENCY:?}
      CORE_API_AUTH_HASH_QUEUE: ${CORE_API_AUTH_HASH_QUEUE:?}
      CORE_API_AUTH_HASH_WAIT: ${CORE_API_AUTH_HASH_WAIT:?}
      CORE_API_AUTH_LOGIN_MAX_PER_MINUTE: ${CORE_API_AUTH_LOGIN_MAX_PER_MINUTE:?}
      CORE_API_AUTH_MAGIC_LINK_MAX_PER_EMAIL_HOUR: ${CORE_API_AUTH_MAGIC_LINK_MAX_PER_EMAIL_HOUR:?}
      CORE_API_AUTH_MAGIC_LINK_MAX_PER_IP_HOUR: ${CORE_API_AUTH_MAGIC_LINK_MAX_PER_IP_HOUR:?}
      CORE_API_SESSION_TIMEOUT: ${CORE_API_SESSION_TIMEOUT:?}
      CORE_API_MAGIC_LINK_TTL: ${CORE_API_MAGIC_LINK_TTL:?}
      CORE_API_MAGIC_LINK_PENDING_CLEANUP_INTERVAL: ${CORE_API_MAGIC_LINK_PENDING_CLEANUP_INTERVAL:?}
      CORE_API_OUTBOX_DELAY: ${CORE_API_OUTBOX_DELAY:?}
      CORE_API_OUTBOX_CLAIM_LEASE: ${CORE_API_OUTBOX_CLAIM_LEASE:?}
      CORE_API_OUTBOX_CONFIRM_TIMEOUT: ${CORE_API_OUTBOX_CONFIRM_TIMEOUT:?}
      CORE_API_RETENTION_INTERVAL: ${CORE_API_RETENTION_INTERVAL:?}
      CORE_API_MESSAGE_RETENTION: ${CORE_API_MESSAGE_RETENTION:?}
      CORE_API_AUDIT_RETENTION: ${CORE_API_AUDIT_RETENTION:?}
      CORE_API_REQUIRE_HTTPS: ${CORE_API_REQUIRE_HTTPS:?}
      CORE_API_COOKIE_SECURE: ${CORE_API_COOKIE_SECURE:?}
      DOWNLOAD_MAX_APPS: ${DOWNLOAD_MAX_APPS:?}
      DOWNLOAD_ZIP_RETENTION: ${DOWNLOAD_ZIP_RETENTION:?}
      DOWNLOAD_PRESIGNED_URL_TTL: ${DOWNLOAD_PRESIGNED_URL_TTL:?}
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR: ${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR:?}
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR: ${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR:?}
      DOWNLOAD_SSE_HEARTBEAT: ${DOWNLOAD_SSE_HEARTBEAT:?}
      CORE_API_CATALOG_CACHE_MAXIMUM_SIZE: ${CORE_API_CATALOG_CACHE_MAXIMUM_SIZE:?}
      CORE_API_CATALOG_CACHE_TTL: ${CORE_API_CATALOG_CACHE_TTL:?}
      CORE_API_DOWNLOAD_EVENTS_QUEUE: ${CORE_API_DOWNLOAD_EVENTS_QUEUE:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      CORE_API_ADMIN_USERNAME: ${CORE_API_ADMIN_USERNAME:?}
      CORE_API_ADMIN_EMAIL: ${CORE_API_ADMIN_EMAIL:?}
      CORE_API_ADMIN_PASSWORD: ${CORE_API_ADMIN_PASSWORD?}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY?}
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN?}
      SCRAPER_URL_PROTECTION_SECRET: ${SCRAPER_URL_PROTECTION_SECRET?}
      CORE_API_DOWNLOAD_OWNER_SECRET: ${CORE_API_DOWNLOAD_OWNER_SECRET?}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE:?}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:?}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?}
      MINIO_CORE_ACCESS_KEY: ${MINIO_CORE_ACCESS_KEY:?}
      MINIO_CORE_SECRET_KEY: ${MINIO_CORE_SECRET_KEY:?}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET:?}
      MINIO_REGION: ${MINIO_REGION:?}
    cpu_shares: 1024
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_API_HOST_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      start_period: 120s

  semantic-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    environment:
      <<: *semantic-environment
      SEMANTIC_DATABASE_ROLE: ${SEMANTIC_SERVICE_SEMANTIC_DATABASE_ROLE:?}
    cpu_shares: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/semantic/health/ready', timeout=3).read()",
        ]
      start_period: 180s

  semantic-indexer:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
    command: ["python", "-m", "app.indexer", "--loop"]
    environment:
      <<: *semantic-environment
      SEMANTIC_DATABASE_ROLE: ${SEMANTIC_INDEXER_SEMANTIC_DATABASE_ROLE:?}
    cpu_shares: 128
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker", "indexer", "--writable", "/models"]
      interval: 30s
      retries: 3
      start_period: 120s

  notification-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-notification-service:${GHCR_IMAGE_TAG:?GHCR_IMAGE_TAG is required}
    pull_policy: always
