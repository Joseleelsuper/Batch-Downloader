name: batch-downloader

services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/installers;
      mc mb --ignore-existing local/zips;
      mc mb --ignore-existing local/manifests;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  scraper-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG}
    pull_policy: always
    environment:
      SCRAPPER_APP_NAME: ${SCRAPPER_APP_NAME}
      SCRAPPER_ENVIRONMENT: ${SCRAPPER_ENVIRONMENT}
      SCRAPPER_DATABASE_HOST: mysql
      SCRAPPER_DATABASE_PORT: 3306
      SCRAPPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL}
      SCRAPPER_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_REQUEST_TIMEOUT_SECONDS}
      SCRAPPER_MAX_REDIRECTS: ${SCRAPPER_MAX_REDIRECTS}
      SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES: ${SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES}
      SCRAPPER_ICON_MAX_BYTES: ${SCRAPPER_ICON_MAX_BYTES}
      SCRAPPER_MANUAL_INSPECTION_TTL_HOURS: ${SCRAPPER_MANUAL_INSPECTION_TTL_HOURS:-24}
      SCRAPPER_MANUAL_INSPECTION_MAX_ATTEMPTS: ${SCRAPPER_MANUAL_INSPECTION_MAX_ATTEMPTS:-4}
      SCRAPPER_MANUAL_PAGE_MAX_BYTES: ${SCRAPPER_MANUAL_PAGE_MAX_BYTES:-1000000}
      SCRAPPER_SO_FILTER_CONCURRENCY: ${SCRAPPER_SO_FILTER_CONCURRENCY}
      SCRAPPER_SO_FILTER_MAX_ATTEMPTS: ${SCRAPPER_SO_FILTER_MAX_ATTEMPTS}
      SCRAPPER_SCRAPE_CONCURRENCY: ${SCRAPPER_SCRAPE_CONCURRENCY}
      SCRAPPER_CPU_THREAD_WORKERS: ${SCRAPPER_CPU_THREAD_WORKERS}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES: ${SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS}
      SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS: ${SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS}
      SCRAPPER_PLAYWRIGHT_TIMEOUT_MS: ${SCRAPPER_PLAYWRIGHT_TIMEOUT_MS}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_GROQ_BASE_URL: ${SCRAPPER_LLM_GROQ_BASE_URL}
      SCRAPPER_LLM_GROQ_MODEL: ${SCRAPPER_LLM_GROQ_MODEL}
      SCRAPPER_LLM_GROQ_FALLBACK_MODELS: ${SCRAPPER_LLM_GROQ_FALLBACK_MODELS}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_BASE_URL: ${SCRAPPER_LLM_DEEPSEEK_BASE_URL}
      SCRAPPER_LLM_DEEPSEEK_MODEL: ${SCRAPPER_LLM_DEEPSEEK_MODEL}
      SCRAPPER_LLM_MAX_CONCURRENCY: ${SCRAPPER_LLM_MAX_CONCURRENCY}
      SCRAPPER_LLM_MAX_APPS_PER_RUN: ${SCRAPPER_LLM_MAX_APPS_PER_RUN}
      SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS}
      SCRAPPER_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
    ports:
      - "${SCRAPPER_API_HOST_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  scraper-scheduler:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-scraper:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["scheduler"]
    environment:
      SCRAPPER_APP_NAME: ${SCRAPPER_APP_NAME}
      SCRAPPER_ENVIRONMENT: ${SCRAPPER_ENVIRONMENT}
      SCRAPPER_DATABASE_HOST: mysql
      SCRAPPER_DATABASE_PORT: 3306
      SCRAPPER_DATABASE_NAME: ${MYSQL_DATABASE}
      SCRAPPER_DATABASE_USERNAME: ${MYSQL_USER}
      SCRAPPER_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL}
      SCRAPPER_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_REQUEST_TIMEOUT_SECONDS}
      SCRAPPER_MAX_REDIRECTS: ${SCRAPPER_MAX_REDIRECTS}
      SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES: ${SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES}
      SCRAPPER_ICON_MAX_BYTES: ${SCRAPPER_ICON_MAX_BYTES}
      SCRAPPER_MANUAL_INSPECTION_TTL_HOURS: ${SCRAPPER_MANUAL_INSPECTION_TTL_HOURS:-24}
      SCRAPPER_MANUAL_INSPECTION_MAX_ATTEMPTS: ${SCRAPPER_MANUAL_INSPECTION_MAX_ATTEMPTS:-4}
      SCRAPPER_MANUAL_PAGE_MAX_BYTES: ${SCRAPPER_MANUAL_PAGE_MAX_BYTES:-1000000}
      SCRAPPER_SO_FILTER_CONCURRENCY: ${SCRAPPER_SO_FILTER_CONCURRENCY}
      SCRAPPER_SO_FILTER_MAX_ATTEMPTS: ${SCRAPPER_SO_FILTER_MAX_ATTEMPTS}
      SCRAPPER_SCRAPE_CONCURRENCY: ${SCRAPPER_SCRAPE_CONCURRENCY}
      SCRAPPER_CPU_THREAD_WORKERS: ${SCRAPPER_CPU_THREAD_WORKERS}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES: ${SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS}
      SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS: ${SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS}
      SCRAPPER_PLAYWRIGHT_TIMEOUT_MS: ${SCRAPPER_PLAYWRIGHT_TIMEOUT_MS}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_GROQ_BASE_URL: ${SCRAPPER_LLM_GROQ_BASE_URL}
      SCRAPPER_LLM_GROQ_MODEL: ${SCRAPPER_LLM_GROQ_MODEL}
      SCRAPPER_LLM_GROQ_FALLBACK_MODELS: ${SCRAPPER_LLM_GROQ_FALLBACK_MODELS}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_BASE_URL: ${SCRAPPER_LLM_DEEPSEEK_BASE_URL}
      SCRAPPER_LLM_DEEPSEEK_MODEL: ${SCRAPPER_LLM_DEEPSEEK_MODEL}
      SCRAPPER_LLM_MAX_CONCURRENCY: ${SCRAPPER_LLM_MAX_CONCURRENCY}
      SCRAPPER_LLM_MAX_APPS_PER_RUN: ${SCRAPPER_LLM_MAX_APPS_PER_RUN}
      SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS}
    depends_on:
      scraper-api:
        condition: service_healthy

  webapp:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-webapp:${GHCR_IMAGE_TAG}
    pull_policy: always
    ports:
      - "${WEBAPP_HOST_PORT}:80"
    depends_on:
      core-api:
        condition: service_started

  core-api:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-core-api:${GHCR_IMAGE_TAG}
    pull_policy: always
    environment:
      CORE_API_SERVER_PORT: ${CORE_API_SERVER_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CORE_API_ADMIN_USERNAME: ${CORE_API_ADMIN_USERNAME}
      CORE_API_ADMIN_EMAIL: ${CORE_API_ADMIN_EMAIL}
      CORE_API_ADMIN_PASSWORD_HASH: ${CORE_API_ADMIN_PASSWORD_HASH}
      CORE_API_BCRYPT_STRENGTH: ${CORE_API_BCRYPT_STRENGTH}
      CORE_API_SESSION_TIMEOUT: ${CORE_API_SESSION_TIMEOUT}
      CORE_API_VERIFICATION_TTL: ${CORE_API_VERIFICATION_TTL}
      CORE_API_PASSWORD_RESET_TTL: ${CORE_API_PASSWORD_RESET_TTL}
      CORE_API_OUTBOX_DELAY: ${CORE_API_OUTBOX_DELAY}
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET}
      CORE_API_JWT_TTL_SECONDS: ${CORE_API_JWT_TTL_SECONDS}
      CORE_API_SCRAPER_API_URL: ${CORE_API_SCRAPER_API_URL}
      CORE_API_SEMANTIC_SERVICE_URL: ${CORE_API_SEMANTIC_SERVICE_URL}
      CORE_API_SEMANTIC_REQUEST_TIMEOUT: ${CORE_API_SEMANTIC_REQUEST_TIMEOUT}
      CORE_API_SEMANTIC_ADMIN_REQUEST_TIMEOUT: ${CORE_API_SEMANTIC_ADMIN_REQUEST_TIMEOUT}
      SCRAPPER_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      CORE_API_REQUIRE_HTTPS: "${CORE_API_REQUIRE_HTTPS}"
      CORE_API_COOKIE_SECURE: "${CORE_API_COOKIE_SECURE}"
      CORE_API_DOWNLOAD_OWNER_SECRET: ${CORE_API_DOWNLOAD_OWNER_SECRET}
      DOWNLOAD_MAX_APPS: ${DOWNLOAD_MAX_APPS}
      DOWNLOAD_ZIP_RETENTION: ${DOWNLOAD_ZIP_RETENTION}
      DOWNLOAD_PRESIGNED_URL_TTL: ${DOWNLOAD_PRESIGNED_URL_TTL}
      DOWNLOAD_ANONYMOUS_MAX_ACTIVE_JOBS: ${DOWNLOAD_ANONYMOUS_MAX_ACTIVE_JOBS}
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR: ${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_HOUR}
      DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR: ${DOWNLOAD_ANONYMOUS_MAX_CREATES_PER_IP_HOUR}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE}
      CORE_API_DOWNLOAD_EVENTS_QUEUE: ${CORE_API_DOWNLOAD_EVENTS_QUEUE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ZIP_BUCKET: ${MINIO_ZIP_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
    ports:
      - "${CORE_API_HOST_PORT}:${CORE_API_SERVER_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
      semantic-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  semantic-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
      SEMANTIC_DEVICE: ${SEMANTIC_DEVICE}
      SEMANTIC_INITIAL_MODEL_VERSION: ${SEMANTIC_INITIAL_MODEL_VERSION}
      SEMANTIC_CANDIDATE_LIMIT: ${SEMANTIC_CANDIDATE_LIMIT}
      SEMANTIC_MINIMUM_SIMILARITY: ${SEMANTIC_MINIMUM_SIMILARITY}
      SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE}
      SEMANTIC_INDEX_INTERVAL_SECONDS: ${SEMANTIC_INDEX_INTERVAL_SECONDS}
      SEMANTIC_INDEX_LEASE_SECONDS: ${SEMANTIC_INDEX_LEASE_SECONDS}
      SEMANTIC_SEARCH_TIMEOUT_SECONDS: ${SEMANTIC_SEARCH_TIMEOUT_SECONDS}
      SEMANTIC_OPERATION_POLL_SECONDS: ${SEMANTIC_OPERATION_POLL_SECONDS}
      SEMANTIC_OPERATION_LEASE_SECONDS: ${SEMANTIC_OPERATION_LEASE_SECONDS}
      SEMANTIC_MODEL_MAX_BYTES: ${SEMANTIC_MODEL_MAX_BYTES}
      SEMANTIC_MODEL_MIN_FREE_BYTES: ${SEMANTIC_MODEL_MIN_FREE_BYTES}
    ports:
      - "${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/semantic/health', timeout=3)); assert data['database']",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  semantic-indexer:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.indexer", "--loop"]
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
      SEMANTIC_DEVICE: ${SEMANTIC_DEVICE}
      SEMANTIC_INITIAL_MODEL_VERSION: ${SEMANTIC_INITIAL_MODEL_VERSION}
      SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE}
      SEMANTIC_INDEX_INTERVAL_SECONDS: ${SEMANTIC_INDEX_INTERVAL_SECONDS}
      SEMANTIC_INDEX_LEASE_SECONDS: ${SEMANTIC_INDEX_LEASE_SECONDS}
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    restart: unless-stopped

  semantic-model-worker:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.model_worker"]
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_SCRAPER_API_URL: http://scraper-api:8000
      SEMANTIC_SERVICE_URL: http://semantic-service:8000
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
      SEMANTIC_DEVICE: ${SEMANTIC_DEVICE}
      SEMANTIC_INITIAL_MODEL_VERSION: ${SEMANTIC_INITIAL_MODEL_VERSION}
      SEMANTIC_MINIMUM_SIMILARITY: ${SEMANTIC_MINIMUM_SIMILARITY}
      SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE}
      SEMANTIC_INDEX_LEASE_SECONDS: ${SEMANTIC_INDEX_LEASE_SECONDS}
      SEMANTIC_OPERATION_POLL_SECONDS: ${SEMANTIC_OPERATION_POLL_SECONDS}
      SEMANTIC_OPERATION_LEASE_SECONDS: ${SEMANTIC_OPERATION_LEASE_SECONDS}
      SEMANTIC_MODEL_MAX_BYTES: ${SEMANTIC_MODEL_MAX_BYTES}
      SEMANTIC_MODEL_MIN_FREE_BYTES: ${SEMANTIC_MODEL_MIN_FREE_BYTES}
    depends_on:
      semantic-service:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports
    restart: unless-stopped

  semantic-trainer:
    profiles: ["training"]
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-semantic-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "app.trainer"]
    environment:
      SEMANTIC_DATABASE_HOST: postgres
      SEMANTIC_DATABASE_PORT: 5432
      SEMANTIC_DATABASE_NAME: ${POSTGRES_DB}
      SEMANTIC_DATABASE_USERNAME: ${POSTGRES_USER}
      SEMANTIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEMANTIC_INTERNAL_SERVICE_TOKEN: ${SCRAPPER_INTERNAL_SERVICE_TOKEN}
      SEMANTIC_MODEL_CACHE_DIR: /models
      SEMANTIC_REPORTS_DIR: /reports
      SEMANTIC_DEVICE: ${SEMANTIC_TRAINER_DEVICE}
      SEMANTIC_TRAINER_SEED: ${SEMANTIC_TRAINER_SEED}
      SEMANTIC_TRAINER_EPOCHS: ${SEMANTIC_TRAINER_EPOCHS}
      SEMANTIC_TRAINER_BATCH_SIZE: ${SEMANTIC_TRAINER_BATCH_SIZE}
      SEMANTIC_TRAINER_MAX_STEPS: ${SEMANTIC_TRAINER_MAX_STEPS}
      SEMANTIC_TRAINER_MODELS: ${SEMANTIC_TRAINER_MODELS}
    depends_on:
      semantic-service:
        condition: service_healthy
    volumes:
      - semantic_models:/models
      - semantic_reports:/reports

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "${MAILPIT_SMTP_HOST_PORT}:1025"
      - "${MAILPIT_UI_HOST_PORT}:8025"

  notification-service:
    image: ${GHCR_REGISTRY}/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-notification-service:${GHCR_IMAGE_TAG}
    pull_policy: always
    environment:
      NOTIFICATION_SERVICE_SERVER_PORT: ${NOTIFICATION_SERVICE_SERVER_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE}
      NOTIFICATION_RETRY_MAX_ATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS}
      NOTIFICATION_RETRY_INITIAL_INTERVAL: ${NOTIFICATION_RETRY_INITIAL_INTERVAL}
      NOTIFICATION_RETRY_MULTIPLIER: ${NOTIFICATION_RETRY_MULTIPLIER}
      NOTIFICATION_RETRY_MAX_INTERVAL: ${NOTIFICATION_RETRY_MAX_INTERVAL}
      NOTIFICATION_SERVICE_INBOX_URL: ${NOTIFICATION_SERVICE_INBOX_URL}
      NOTIFICATION_SERVICE_INBOX_USERNAME: ${NOTIFICATION_SERVICE_INBOX_USERNAME}
      NOTIFICATION_SERVICE_INBOX_PASSWORD: ${NOTIFICATION_SERVICE_INBOX_PASSWORD}
      NOTIFICATION_SERVICE_INBOX_LEASE_DURATION: ${NOTIFICATION_SERVICE_INBOX_LEASE_DURATION}
      NOTIFICATION_SERVICE_SMTP_HOST: ${NOTIFICATION_SERVICE_SMTP_HOST}
      NOTIFICATION_SERVICE_SMTP_PORT: ${NOTIFICATION_SERVICE_SMTP_PORT}
      NOTIFICATION_SERVICE_SMTP_USERNAME: ${NOTIFICATION_SERVICE_SMTP_USERNAME}
      NOTIFICATION_SERVICE_SMTP_PASSWORD: ${NOTIFICATION_SERVICE_SMTP_PASSWORD}
      NOTIFICATION_SERVICE_SMTP_AUTH: "${NOTIFICATION_SERVICE_SMTP_AUTH}"
      NOTIFICATION_SERVICE_SMTP_STARTTLS: "${NOTIFICATION_SERVICE_SMTP_STARTTLS}"
      NOTIFICATION_SERVICE_SMTP_CONNECTION_TIMEOUT_MS: ${NOTIFICATION_SERVICE_SMTP_CONNECTION_TIMEOUT_MS}
      NOTIFICATION_SERVICE_SMTP_TIMEOUT_MS: ${NOTIFICATION_SERVICE_SMTP_TIMEOUT_MS}
      NOTIFICATION_SERVICE_SMTP_WRITE_TIMEOUT_MS: ${NOTIFICATION_SERVICE_SMTP_WRITE_TIMEOUT_MS}
