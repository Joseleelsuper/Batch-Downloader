[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mysql: integration test that requires a Docker-backed MySQL 8.4 container",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Dependency factories in FastAPI signatures are the framework's intended API.
"app/api/routes.py" = ["B008"]
