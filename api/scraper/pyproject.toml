[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mysql: integration test that requires a Docker-backed MySQL 8.4 container",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
# Las rutas, la validación y la aplicación manual ya están separadas por caso de uso.
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Dependency factories in FastAPI signatures are the framework's intended API.
"app/api/routes.py" = ["B008"]
