name: batch-downloader

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-batch_downloader}
      MYSQL_USER: ${MYSQL_USER:-batch_downloader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-batch_downloader}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batch_downloader_semantic}
      POSTGRES_USER: ${POSTGRES_USER:-batch_downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batch_downloader}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-batch_downloader}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-batch_downloader}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-batch_downloader}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-batch_downloader_secret}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/installers;
      mc mb --ignore-existing local/zips;
      mc mb --ignore-existing local/manifests;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-batch_downloader}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-batch_downloader_secret}

  scraper-api:
    build:
      context: ./api/scrapper
    environment:
      SCRAPPER_DATABASE_URL: ${SCRAPPER_DOCKER_DATABASE_URL:-mysql+asyncmy://batch_downloader:batch_downloader@mysql:3306/batch_downloader}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET:-local-development-change-me}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL:-https://winstall.app}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL:-https://winstall.app/api/winstall}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE:-Europe/Madrid}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR:-3}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE:-0}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP:-true}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS:-0}
      SCRAPPER_PLAYWRIGHT_ENABLED: ${SCRAPPER_PLAYWRIGHT_ENABLED:-true}
    ports:
      - "${SCRAPPER_API_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  scraper-scheduler:
    build:
      context: ./api/scrapper
    command: ["scheduler"]
    environment:
      SCRAPPER_DATABASE_URL: ${SCRAPPER_DOCKER_DATABASE_URL:-mysql+asyncmy://batch_downloader:batch_downloader@mysql:3306/batch_downloader}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET:-local-development-change-me}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL:-https://winstall.app}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL:-https://winstall.app/api/winstall}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE:-Europe/Madrid}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR:-3}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE:-0}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP:-true}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS:-0}
      SCRAPPER_PLAYWRIGHT_ENABLED: ${SCRAPPER_PLAYWRIGHT_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy

  webapp:
    build:
      context: ./services/webapp
    ports:
      - "${WEBAPP_HOST_PORT:-3000}:80"
    depends_on:
      scraper-api:
        condition: service_healthy

  core-api:
    build:
      context: ./services/core-api
    environment:
      CORE_API_SERVER_PORT: ${CORE_API_SERVER_PORT:-8080}
      MYSQL_URL: ${CORE_API_MYSQL_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-batch_downloader}}
      RABBITMQ_HOST: ${CORE_API_RABBITMQ_HOST:-rabbitmq}
      SCRAPER_API_URL: ${CORE_API_SCRAPPER_API_URL:-http://scraper-api:8000}
    ports:
      - "${CORE_API_HOST_PORT:-8081}:${CORE_API_SERVER_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  semantic-service:
    build:
      context: ./services/semantic-service
    environment:
      POSTGRES_DSN: ${SEMANTIC_SERVICE_POSTGRES_DSN:-postgresql://${POSTGRES_USER:-batch_downloader}:${POSTGRES_PASSWORD:-batch_downloader}@postgres:5432/${POSTGRES_DB:-batch_downloader_semantic}}
    ports:
      - "${SEMANTIC_SERVICE_HOST_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      NOTIFICATION_SERVICE_SERVER_PORT: ${NOTIFICATION_SERVICE_SERVER_PORT:-8080}
      RABBITMQ_HOST: ${NOTIFICATION_SERVICE_RABBITMQ_HOST:-rabbitmq}
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8083}:${NOTIFICATION_SERVICE_SERVER_PORT:-8080}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  download-worker:
    build:
      context: ./services/download-worker
    environment:
      DOWNLOAD_WORKER_SERVER_PORT: ${DOWNLOAD_WORKER_SERVER_PORT:-8080}
      RABBITMQ_HOST: ${DOWNLOAD_WORKER_RABBITMQ_HOST:-rabbitmq}
      MINIO_ENDPOINT: ${DOWNLOAD_WORKER_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${DOWNLOAD_WORKER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-batch_downloader}}
      MINIO_SECRET_KEY: ${DOWNLOAD_WORKER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-batch_downloader_secret}}
    ports:
      - "${DOWNLOAD_WORKER_HOST_PORT:-8084}:${DOWNLOAD_WORKER_SERVER_PORT:-8080}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  translation-service:
    build:
      context: ./services/translation-service
    environment:
      TRANSLATION_SERVICE_SERVER_PORT: ${TRANSLATION_SERVICE_SERVER_PORT:-8080}
      TRANSLATION_SERVICE_LOCALES_PATH: ${TRANSLATION_SERVICE_LOCALES_PATH:-/app/locales}
    ports:
      - "${TRANSLATION_SERVICE_HOST_PORT:-8085}:${TRANSLATION_SERVICE_SERVER_PORT:-8080}"

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  minio_data:
