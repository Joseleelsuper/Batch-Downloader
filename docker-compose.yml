name: batch-downloader

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/installers;
      mc mb --ignore-existing local/zips;
      mc mb --ignore-existing local/manifests;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  scraper-api:
    build:
      context: ./api/scrapper
    environment:
      SCRAPPER_APP_NAME: ${SCRAPPER_APP_NAME}
      SCRAPPER_ENVIRONMENT: ${SCRAPPER_ENVIRONMENT}
      SCRAPPER_DATABASE_URL: ${SCRAPPER_DOCKER_DATABASE_URL}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL}
      SCRAPPER_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_REQUEST_TIMEOUT_SECONDS}
      SCRAPPER_MAX_REDIRECTS: ${SCRAPPER_MAX_REDIRECTS}
      SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES: ${SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES}
      SCRAPPER_SCRAPE_PAGE_SIZE: ${SCRAPPER_SCRAPE_PAGE_SIZE}
      SCRAPPER_SCRAPE_CONCURRENCY: ${SCRAPPER_SCRAPE_CONCURRENCY}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP}
      SCRAPPER_RUN_LOCK_STALE_MINUTES: ${SCRAPPER_RUN_LOCK_STALE_MINUTES}
      SCRAPPER_RESOLVED_SOURCE_TTL_HOURS: ${SCRAPPER_RESOLVED_SOURCE_TTL_HOURS}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES: ${SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS}
      SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS: ${SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS}
      SCRAPPER_PREFERRED_OPERATING_SYSTEM: ${SCRAPPER_PREFERRED_OPERATING_SYSTEM}
      SCRAPPER_PREFERRED_ARCHITECTURE: ${SCRAPPER_PREFERRED_ARCHITECTURE}
      SCRAPPER_PLAYWRIGHT_ENABLED: ${SCRAPPER_PLAYWRIGHT_ENABLED}
      SCRAPPER_PLAYWRIGHT_TIMEOUT_MS: ${SCRAPPER_PLAYWRIGHT_TIMEOUT_MS}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_GROQ_BASE_URL: ${SCRAPPER_LLM_GROQ_BASE_URL}
      SCRAPPER_LLM_GROQ_MODEL: ${SCRAPPER_LLM_GROQ_MODEL}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_BASE_URL: ${SCRAPPER_LLM_DEEPSEEK_BASE_URL}
      SCRAPPER_LLM_DEEPSEEK_MODEL: ${SCRAPPER_LLM_DEEPSEEK_MODEL}
      SCRAPPER_LLM_MAX_CONCURRENCY: ${SCRAPPER_LLM_MAX_CONCURRENCY}
      SCRAPPER_LLM_MAX_APPS_PER_RUN: ${SCRAPPER_LLM_MAX_APPS_PER_RUN}
      SCRAPPER_LLM_ENRICH_INTERVAL_APPS: ${SCRAPPER_LLM_ENRICH_INTERVAL_APPS}
      SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS}
    ports:
      - "${SCRAPPER_API_HOST_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  scraper-scheduler:
    build:
      context: ./api/scrapper
    command: ["scheduler"]
    environment:
      SCRAPPER_APP_NAME: ${SCRAPPER_APP_NAME}
      SCRAPPER_ENVIRONMENT: ${SCRAPPER_ENVIRONMENT}
      SCRAPPER_DATABASE_URL: ${SCRAPPER_DOCKER_DATABASE_URL}
      SCRAPPER_WINSTALL_BASE_URL: ${SCRAPPER_WINSTALL_BASE_URL}
      SCRAPPER_WINSTALL_API_BASE_URL: ${SCRAPPER_WINSTALL_API_BASE_URL}
      SCRAPPER_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_REQUEST_TIMEOUT_SECONDS}
      SCRAPPER_MAX_REDIRECTS: ${SCRAPPER_MAX_REDIRECTS}
      SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES: ${SCRAPPER_MAX_DOWNLOAD_SIZE_BYTES}
      SCRAPPER_SCRAPE_PAGE_SIZE: ${SCRAPPER_SCRAPE_PAGE_SIZE}
      SCRAPPER_SCRAPE_CONCURRENCY: ${SCRAPPER_SCRAPE_CONCURRENCY}
      SCRAPPER_SCHEDULER_TIMEZONE: ${SCRAPPER_SCHEDULER_TIMEZONE}
      SCRAPPER_SCHEDULER_HOUR: ${SCRAPPER_SCHEDULER_HOUR}
      SCRAPPER_SCHEDULER_MINUTE: ${SCRAPPER_SCHEDULER_MINUTE}
      SCRAPPER_RUN_ON_STARTUP: ${SCRAPPER_RUN_ON_STARTUP}
      SCRAPPER_RUN_LOCK_STALE_MINUTES: ${SCRAPPER_RUN_LOCK_STALE_MINUTES}
      SCRAPPER_RESOLVED_SOURCE_TTL_HOURS: ${SCRAPPER_RESOLVED_SOURCE_TTL_HOURS}
      SCRAPPER_URL_PROTECTION_SECRET: ${SCRAPPER_URL_PROTECTION_SECRET}
      SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES: ${SCRAPPER_ALLOWED_DOWNLOAD_SCHEMES}
      SCRAPPER_SCRAPE_MAX_APPS: ${SCRAPPER_SCRAPE_MAX_APPS}
      SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS: ${SCRAPPER_SCRAPE_APP_TIMEOUT_SECONDS}
      SCRAPPER_PREFERRED_OPERATING_SYSTEM: ${SCRAPPER_PREFERRED_OPERATING_SYSTEM}
      SCRAPPER_PREFERRED_ARCHITECTURE: ${SCRAPPER_PREFERRED_ARCHITECTURE}
      SCRAPPER_PLAYWRIGHT_ENABLED: ${SCRAPPER_PLAYWRIGHT_ENABLED}
      SCRAPPER_PLAYWRIGHT_TIMEOUT_MS: ${SCRAPPER_PLAYWRIGHT_TIMEOUT_MS}
      SCRAPPER_LLM_GROQ_API_KEY: ${SCRAPPER_LLM_GROQ_API_KEY}
      SCRAPPER_LLM_GROQ_BASE_URL: ${SCRAPPER_LLM_GROQ_BASE_URL}
      SCRAPPER_LLM_GROQ_MODEL: ${SCRAPPER_LLM_GROQ_MODEL}
      SCRAPPER_LLM_DEEPSEEK_API_KEY: ${SCRAPPER_LLM_DEEPSEEK_API_KEY}
      SCRAPPER_LLM_DEEPSEEK_BASE_URL: ${SCRAPPER_LLM_DEEPSEEK_BASE_URL}
      SCRAPPER_LLM_DEEPSEEK_MODEL: ${SCRAPPER_LLM_DEEPSEEK_MODEL}
      SCRAPPER_LLM_MAX_CONCURRENCY: ${SCRAPPER_LLM_MAX_CONCURRENCY}
      SCRAPPER_LLM_MAX_APPS_PER_RUN: ${SCRAPPER_LLM_MAX_APPS_PER_RUN}
      SCRAPPER_LLM_ENRICH_INTERVAL_APPS: ${SCRAPPER_LLM_ENRICH_INTERVAL_APPS}
      SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS: ${SCRAPPER_LLM_REQUEST_TIMEOUT_SECONDS}
    depends_on:
      scraper-api:
        condition: service_healthy

  webapp:
    build:
      context: ./services/webapp
      args:
        VITE_API_BASE_URL: ${WEBAPP_VITE_API_BASE_URL}
    ports:
      - "${WEBAPP_HOST_PORT}:80"
    depends_on:
      core-api:
        condition: service_started

  core-api:
    build:
      context: ./services/core-api
    environment:
      CORE_API_SERVER_PORT: ${CORE_API_SERVER_PORT}
      CORE_API_MYSQL_URL: ${CORE_API_MYSQL_URL}
      CORE_API_MYSQL_USERNAME: ${CORE_API_MYSQL_USERNAME}
      CORE_API_MYSQL_PASSWORD: ${CORE_API_MYSQL_PASSWORD}
      CORE_API_ADMIN_USERNAME: ${CORE_API_ADMIN_USERNAME}
      CORE_API_ADMIN_PASSWORD_HASH: ${CORE_API_ADMIN_PASSWORD_HASH}
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET}
      CORE_API_JWT_TTL_SECONDS: ${CORE_API_JWT_TTL_SECONDS}
      CORE_API_COOKIE_SECURE: ${CORE_API_COOKIE_SECURE}
      CORE_API_SCRAPPER_API_URL: ${CORE_API_SCRAPPER_API_URL}
    ports:
      - "${CORE_API_HOST_PORT}:${CORE_API_SERVER_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  semantic-service:
    build:
      context: ./services/semantic-service
    environment:
      POSTGRES_DSN: ${SEMANTIC_SERVICE_POSTGRES_DSN}
    ports:
      - "${SEMANTIC_SERVICE_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      NOTIFICATION_SERVICE_SERVER_PORT: ${NOTIFICATION_SERVICE_SERVER_PORT}
      RABBITMQ_HOST: ${NOTIFICATION_SERVICE_RABBITMQ_HOST}
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT}:${NOTIFICATION_SERVICE_SERVER_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  download-worker:
    build:
      context: ./services/download-worker
    environment:
      DOWNLOAD_WORKER_SERVER_PORT: ${DOWNLOAD_WORKER_SERVER_PORT}
      RABBITMQ_HOST: ${DOWNLOAD_WORKER_RABBITMQ_HOST}
      MINIO_ENDPOINT: ${DOWNLOAD_WORKER_MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${DOWNLOAD_WORKER_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${DOWNLOAD_WORKER_MINIO_SECRET_KEY}
    ports:
      - "${DOWNLOAD_WORKER_HOST_PORT}:${DOWNLOAD_WORKER_SERVER_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  translation-service:
    build:
      context: ./services/translation-service
    environment:
      TRANSLATION_SERVICE_SERVER_PORT: ${TRANSLATION_SERVICE_SERVER_PORT}
      TRANSLATION_SERVICE_LOCALES_PATH: ${TRANSLATION_SERVICE_LOCALES_PATH}
    ports:
      - "${TRANSLATION_SERVICE_HOST_PORT}:${TRANSLATION_SERVICE_SERVER_PORT}"

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  minio_data:
