openapi: 3.1.0
info:
  title: Batch Downloader API
  version: 1.0.0
  description: API pública versionada para identidad, catálogo y trabajos de descarga.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/magic-link/request:
    post:
      operationId: requestMagicLink
      summary: Solicitar un enlace de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Solicitud aceptada sin revelar si existe la cuenta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /auth/magic-link/confirm:
    post:
      operationId: confirmMagicLink
      summary: Confirmar un enlace de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Sesión iniciada con el enlace de acceso.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Enlace caducado o utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar la sesión actual
      responses:
        '204':
          description: Sesión invalidada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /auth/me:
    get:
      operationId: currentUser
      summary: Consultar la sesión actual
      security: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '204':
          description: No existe una sesión autenticada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      operationId: getOwnProfile
      summary: Consultar el perfil de la cuenta USER
      responses:
        '200':
          description: Perfil actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - USER
    patch:
      operationId: updateOwnProfile
      summary: Cambiar el username de presentación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - USER
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /users/me/dashboard:
    get:
      operationId: getOwnDashboard
      summary: Consultar el resumen privado de la cuenta
      responses:
        '200':
          description: Conteos y actividad reciente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - USER
  /users/me/downloads:
    get:
      operationId: listOwnDownloadHistory
      summary: Listar el historial registrado al alcanzar READY
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historial paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - USER
  /users/me/bundles:
    get:
      operationId: listOwnBundles
      summary: Listar bundles propios
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bundles propios paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnBundlePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - USER
    post:
      operationId: createOwnBundle
      summary: Crear un bundle USER privado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnBundleRequest'
      responses:
        '201':
          description: Bundle privado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - USER
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /users/me/bundles/{bundleId}:
    parameters:
    - name: bundleId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getOwnBundle
      summary: Consultar un bundle editable propio
      responses:
        '200':
          description: Bundle propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - USER
    patch:
      operationId: updateOwnBundle
      summary: Actualizar un bundle con control optimista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnBundleRequest'
      responses:
        '200':
          description: Bundle actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - USER
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
    delete:
      operationId: deleteOwnBundle
      summary: Eliminar un bundle propio
      responses:
        '204':
          description: Bundle eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - USER
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: Iniciar sesión administrativa por username
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Sesión ADMIN iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /admin/auth/me:
    get:
      operationId: currentAdmin
      summary: Consultar la sesión ADMIN
      responses:
        '200':
          description: Administrador autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - ADMIN
      description: ''
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Cerrar la sesión administrativa
      responses:
        '204':
          description: Sesión invalidada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /apps:
    get:
      operationId: searchApps
      summary: Buscar aplicaciones del catálogo
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
          maxLength: 180
      - name: searchMode
        in: query
        description: El valor omitido conserva la búsqueda literal para clientes existentes.
        schema:
          $ref: '#/components/schemas/SearchMode'
          default: lexical
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - available
          - review
          - missing
          default: all
      - name: os
        in: query
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - windows
            - linux
            - macos
      - name: architecture
        in: query
        schema:
          type: string
      - name: tag
        in: query
        description: Puede repetirse; la aplicación debe contener todas las tags indicadas.
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
      - name: publisher
        in: query
        description: Editor único que debe coincidir con la aplicación.
        schema:
          type: string
      - name: sort
        in: query
        description: Orden principal de presentación, también cuando query y búsqueda semántica están activos.
        schema:
          type: string
          enum:
          - name
          - updated
          - downloads
          default: name
      responses:
        '200':
          description: Página de aplicaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /apps/facets:
    get:
      operationId: getCatalogFacets
      summary: Consultar facetas del catálogo filtrado
      security: []
      parameters:
      - name: query
        in: query
        schema:
          type: string
          maxLength: 180
      - name: searchMode
        in: query
        description: Aplica la misma enumeración híbrida que la página de aplicaciones.
        schema:
          $ref: '#/components/schemas/SearchMode'
          default: lexical
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - available
          - review
          - missing
          default: all
      - name: os
        in: query
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - windows
            - linux
            - macos
      - name: architecture
        in: query
        schema:
          type: string
      - name: tag
        in: query
        description: Puede repetirse; las facetas se calculan sobre aplicaciones que contienen todas las
          tags indicadas.
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
      - name: publisher
        in: query
        description: Editor único aplicado también al cálculo de tags y editores disponibles.
        schema:
          type: string
      responses:
        '200':
          description: Tags y editores de las aplicaciones que cumplen conjuntamente búsqueda, estado, SO,
            arquitectura, tags y editor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFacets'
        '400':
          $ref: '#/components/responses/BadRequest'
  /apps/stats:
    get:
      operationId: getCatalogStats
      summary: Consultar estadísticas y último rastreo
      security: []
      responses:
        '200':
          description: Estadísticas del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStats'
        '400':
          $ref: '#/components/responses/BadRequest'
  /apps/{appId}:
    get:
      operationId: getApp
      summary: Consultar una aplicación
      security: []
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Detalle de la aplicación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetails'
        '404':
          $ref: '#/components/responses/NotFound'
  /download-jobs:
    post:
      operationId: createDownloadJob
      summary: Crear un trabajo de descarga
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadJobRequest'
      responses:
        '202':
          description: Trabajo persistido y encolado.
          headers:
            Set-Cookie:
              description: Se emite para el primer trabajo anónimo y solo contiene un token aleatorio del
                navegador.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ninguna aplicación solicitada tiene una fuente verificable o el bundle excede el
            límite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Cuota superada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /download-jobs/linux-preview:
    post:
      operationId: previewLinuxDownload
      summary: Revisar compatibilidad y dependencias sin crear una descarga
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadJobRequest'
      responses:
        '200':
          description: Selección Linux compatible, manual y no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinuxDownloadPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/apps/{appId}/linux/sources/{sourceRef}/profile:
    parameters:
    - $ref: '#/components/parameters/AppId'
    - name: sourceRef
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getLinuxInstallProfile
      summary: Consultar una receta Linux (solo administrador)
      responses:
        '200':
          description: Receta y versión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinuxProfileVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - ADMIN
      description: ''
    put:
      operationId: saveLinuxInstallProfile
      summary: Revisar y guardar una receta Linux sin comandos shell
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinuxProfileWrite'
      responses:
        '200':
          description: Nueva versión; afecta a futuros ZIP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinuxProfileVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-required-roles:
      - ADMIN
  /admin/apps/{appId}/linux/dependencies:
    parameters:
    - $ref: '#/components/parameters/AppId'
    get:
      operationId: getLinuxDependencies
      summary: Consultar dependencias de una aplicación (solo administrador)
      responses:
        '200':
          description: Dependencias y versión del grafo de esta aplicación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinuxDependencyVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - ADMIN
      description: ''
    put:
      operationId: saveLinuxDependencies
      summary: Guardar dependencias sin ciclos y con control de concurrencia
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expectedVersion
              - dependencies
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
                dependencies:
                  type: array
                  maxItems: 99
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Grafo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinuxDependencyVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-required-roles:
      - ADMIN
  /download-jobs/{jobId}:
    get:
      operationId: getDownloadJob
      summary: Consultar un trabajo de descarga
      security: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Estado global e items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelDownloadJob
      summary: Cancelar un trabajo de descarga
      security: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Cancelación aceptada de forma idempotente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /download-jobs/{jobId}/events:
    get:
      operationId: streamDownloadJobEvents
      summary: Seguir el progreso de un trabajo
      security: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Flujo SSE hasta alcanzar un estado terminal.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /download-jobs/{jobId}/file:
    get:
      operationId: getDownloadJobFile
      summary: Obtener el ZIP de un trabajo terminado
      security: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '303':
          description: Redirección a una URL firmada válida durante cinco minutos.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /download-jobs/{jobId}/file-link:
    get:
      operationId: prepareDownloadJobFile
      summary: Preparar el enlace del intento automático sin abandonar la interfaz
      security: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: URL firmada válida durante cinco minutos y no almacenable en caché.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadFileLink'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/v1/download-jobs/{jobId}/item-metadata:
    servers:
    - url: /
    post:
      operationId: getInternalDownloadJobItemMetadata
      summary: Obtener el nombre y la página oficial de items fallidos
      description: Endpoint interno para el worker. Devuelve todos los items solicitados o un 404 genérico,
        sin respuestas parciales ni URLs de instalador.
      security:
      - internalServiceToken: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalDownloadItemMetadataRequest'
      responses:
        '200':
          description: Metadatos exactos de todos los items solicitados.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  $ref: '#/components/schemas/InternalDownloadItemMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /bundles:
    get:
      operationId: listBundles
      summary: Listar bundles públicos u oficiales
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - official
          - community
          - user
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - updated
          - stars
      responses:
        '200':
          description: Página de bundles visibles públicamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlePage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /bundles/{bundleId}:
    get:
      operationId: getBundle
      summary: Consultar un bundle público, oficial o privado propio
      security: []
      parameters:
      - name: bundleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalle completo del bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/semantic/overview:
    get:
      operationId: getSemanticAdminOverview
      summary: Consultar salud, modelo local, cobertura e indexador semanticos
      tags:
      - Semantic admin
      responses:
        '200':
          description: Estado operativo del servicio semantico y del indice reconstruible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - ADMIN
      description: ''
