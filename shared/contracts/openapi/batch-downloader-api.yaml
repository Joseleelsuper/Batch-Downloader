      security: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: BATCH_SESSION
    internalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebsiteDiscoveryId:
      name: discoveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
  responses:
    BadRequest:
      description: Entrada no válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sesión ausente o inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: La sesión o el estado de la cuenta no permiten la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: El estado actual impide la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: La URL o el instalador no superan la validación segura.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Un fallo transitorio impide completar la operación.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Límite temporal alcanzado.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ScraperRunRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [incremental, unresolved, selected, full]
        appIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Obligatorio solo para selected; rechazado en los demás scopes.
    ScraperRunRequestResponse:
      type: object
      additionalProperties: false
      required: [requestId, scope, status]
      properties:
        requestId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [incremental, unresolved, selected, full]
        status:
          type: string
          enum: [pending]
    ScraperRunSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - scope
        - targetCount
        - startedAt
        - heartbeatAt
        - appsDiscovered
        - appsResolved
        - appsFailed
        - appsSkipped
        - appsConfirmedMissing
        - appsNeedsReview
        - appsTransientFailed
        - appsSkippedUnchanged
        - stopRequested
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [running, completed, partial, failed]}
        scope: {type: string, enum: [incremental, unresolved, selected, full]}
        requestId: {type: [string, 'null'], format: uuid}
        targetCount: {type: integer, minimum: 0}
        startedAt: {type: string, format: date-time}
        heartbeatAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        appsDiscovered: {type: integer, minimum: 0}
        appsResolved: {type: integer, minimum: 0}
        appsFailed: {type: integer, minimum: 0}
        appsSkipped: {type: integer, minimum: 0}
        appsConfirmedMissing: {type: integer, minimum: 0}
        appsNeedsReview: {type: integer, minimum: 0}
        appsTransientFailed: {type: integer, minimum: 0}
        appsSkippedUnchanged: {type: integer, minimum: 0}
        currentPackageId: {type: [string, 'null']}
        currentAppName: {type: [string, 'null']}
        currentPhase: {type: [string, 'null']}
        stopRequested: {type: boolean}
        pausedAt: {type: [string, 'null'], format: date-time}
        errorSummary: {type: [string, 'null']}
    InstallerAbsenceVerificationRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [officialPageUrl, officialConfirmedAbsent]
          properties:
            officialPageUrl: {type: string, format: uri, pattern: '^https://'}
            officialConfirmedAbsent: {type: boolean, const: true}
        - required: [officialConfirmedAbsent]
          properties:
            officialPageUrl: {type: 'null'}
            officialConfirmedAbsent: {type: boolean, const: false}
      required:
        - reasonCode
        - manifestUrl
        - winstallConfirmedAbsent
        - manifestConfirmedAbsent
        - officialConfirmedAbsent
        - ambiguousAccess
      properties:
        reasonCode:
          type: string
          enum: [no_supported_binary, store_only, command_only, wrapper_only, vendor_discontinued]
        manifestUrl: {type: string, format: uri, pattern: '^https://'}
        officialPageUrl: {type: [string, 'null'], format: uri, pattern: '^https://'}
        winstallConfirmedAbsent: {type: boolean, const: true}
        manifestConfirmedAbsent: {type: boolean, const: true}
        officialConfirmedAbsent: {type: boolean}
        ambiguousAccess: {type: boolean, const: false}
        notes: {type: [string, 'null'], maxLength: 2000}
    InstallerAbsenceVerification:
      type: object
      additionalProperties: false
      required: [id, appId, status, reasonCode, checkedUrls, verifiedBy, verifiedAt, appVersion]
      properties:
        id: {type: string, format: uuid}
        appId: {type: string, format: uuid}
        status: {type: string, enum: [active, invalidated, superseded]}
        reasonCode: {type: string}
        notes: {type: [string, 'null']}
        checkedUrls:
          type: string
          description: JSON con páginas públicas revisadas; nunca contiene URLs de binarios.
        verifiedBy: {type: string}
        verifiedAt: {type: string, format: date-time}
        appVersion: {type: integer, format: int64, minimum: 0}
        winstallLatestVersion: {type: [string, 'null']}
        winstallSummaryFingerprint: {type: [string, 'null']}
        winstallDetailFingerprint: {type: [string, 'null']}
        officialUrlFingerprint: {type: [string, 'null']}
        invalidatedAt: {type: [string, 'null'], format: date-time}
        invalidationReason: {type: [string, 'null']}
    InstallerAbsenceVerificationSummary:
      type: object
      additionalProperties: false
      required: [active, missing, missingWithoutActiveEvidence, review]
      properties:
        active: {type: integer, format: int64, minimum: 0}
        missing: {type: integer, format: int64, minimum: 0}
        missingWithoutActiveEvidence: {type: integer, format: int64, minimum: 0}
        review: {type: integer, format: int64, minimum: 0}
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          description: Máximo de 72 bytes UTF-8.
    UsernameUpdateRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 256
    User:
      type: object
      required: [id, username, email, emailVerified, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time
    App:
      type: object
      required: [id, slug, packageId, name, tags, operatingSystems, downloadable, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        packageId:
          type: string
        name:
          type: string
        publisher:
          type: [string, 'null']
        description:
          type: [string, 'null']
        longDescription:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        operatingSystems:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [windows, linux, macos]
        iconUrl:
          type: [string, 'null']
          format: uri
        latestVersion:
          type: [string, 'null']
        sourceLabel:
          type: string
        resolutionStatus:
          type: string
        validationStatus:
          type: string
        downloadable:
          description: Indica que la aplicación puede incorporarse a un trabajo; la URL se revalida justo antes de descargar.
          type: boolean
        updatedAt:
          type: string
          format: date-time
    AppDetails:
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          required: [originUrl, downloadOptions, notes]
          properties:
            officialUrl:
              type: [string, 'null']
              format: uri
            originUrl:
              type: string
              format: uri
            installerFilename:
              type: [string, 'null']
            installerType:
              type: [string, 'null']
            contentType:
              type: [string, 'null']
            sizeBytes:
              type: [integer, 'null']
              format: int64
            finalDomain:
              type: [string, 'null']
            score:
              type: [integer, 'null']
            checkedAt:
              type: [string, 'null']
              format: date-time
            expiresAt:
              type: [string, 'null']
              format: date-time
            downloadOptions:
              type: array
              items:
                $ref: '#/components/schemas/DownloadOption'
            notes:
              type: string
    ManualInstallerInspectionRequest:
      type: object
      additionalProperties: false
      required: [sourcePageUrl]
      anyOf:
        - required: [installerUrl]
        - required: [installerUrls]
      properties:
        installerUrl:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Compatibilidad con clientes anteriores; se cifra y nunca se devuelve.
        installerUrls:
          $ref: '#/components/schemas/ManualInstallerUrls'
        sourcePageUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Página superior común de la que proceden los instaladores.
    ManualInstallerUrls:
      allOf:
        - $ref: '#/components/schemas/WebsiteAppInstallerUrls'
        - type: object
          description: Debe incluir al menos una URI HTTPS no nula; los huecos son opcionales.
          anyOf:
            - required: [windows]
              properties:
                windows:
                  type: string
            - required: [macos]
              properties:
                macos:
                  type: string
            - required: [linux]
              properties:
                linux:
                  type: string
    ManualFieldSuggestion:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value:
          type: [string, 'null']
        source:
          type: string
          enum:
            - current
            - json_ld
            - open_graph
            - twitter
            - canonical
            - filename
            - generated_ai
            - manual
            - source_page
            - unavailable
    ManualInstallerSuggestions:
      type: object
      additionalProperties: false
      required:
        - name
        - publisher
        - officialUrl
        - latestVersion
        - description
        - longDescription
        - iconUrl
      properties:
        name:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        publisher:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        officialUrl:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        latestVersion:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        description:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        longDescription:
          $ref: '#/components/schemas/ManualFieldSuggestion'
        iconUrl:
          $ref: '#/components/schemas/ManualFieldSuggestion'
    ManualInstallerTechnicalData:
      type: object
      additionalProperties: false
      required:
        - finalDomain
        - filename
        - extension
        - contentType
        - sizeBytes
        - version
        - operatingSystem
        - architecture
        - platformRequired
      properties:
        finalDomain:
          type: [string, 'null']
        filename:
          type: [string, 'null']
        extension:
          type: [string, 'null']
        contentType:
          type: [string, 'null']
        sizeBytes:
          type: [integer, 'null']
          format: int64
        version:
          type: [string, 'null']
        operatingSystem:
          type: [string, 'null']
          enum: [windows, macos, linux, null]
        architecture:
          type: string
          enum: [x86_64, x86, aarch64, unknown]
        platformRequired:
          type: boolean
    ManualInstallerAiState:
      type: object
      additionalProperties: false
      required: [status, provider, model]
      properties:
        status:
          type: string
          enum: [ready, unavailable, failed]
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
    ManualInstallerInspection:
      type: object
      additionalProperties: false
      required:
        - id
        - appId
        - status
        - phase
        - expectedAppVersion
        - warnings
        - suggestions
        - installer
        - installers
        - ai
        - errorCode
        - sourceRef
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, ready, failed, applied, expired]
        phase:
          type: string
        expectedAppVersion:
          type: integer
          format: int64
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        suggestions:
          oneOf:
            - $ref: '#/components/schemas/ManualInstallerSuggestions'
            - type: 'null'
        installer:
          oneOf:
            - $ref: '#/components/schemas/ManualInstallerTechnicalData'
            - type: 'null'
        installers:
          type: array
          minItems: 0
          maxItems: 3
          items:
            $ref: '#/components/schemas/ManualInstallerTechnicalData'
        ai:
          oneOf:
            - $ref: '#/components/schemas/ManualInstallerAiState'
            - type: 'null'
        errorCode:
          type: [string, 'null']
        sourceRef:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ManualInstallerApplyRequest:
      type: object
      additionalProperties: false
      required: [expectedAppVersion, name]
      properties:
        expectedAppVersion:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 180
        publisher:
          type: [string, 'null']
          maxLength: 180
        officialUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
        latestVersion:
          type: [string, 'null']
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 4000
        longDescription:
          type: [string, 'null']
          maxLength: 12000
        iconUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
        operatingSystem:
          type: [string, 'null']
          enum: [windows, macos, linux, null]
    ManualInstallerApplyResponse:
      type: object
      additionalProperties: false
      required: [application, sourceRef, sourceRefs, warnings]
