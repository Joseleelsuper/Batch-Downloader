sonar.projectKey=batch-downloader
sonar.projectName=Batch Downloader
sonar.sourceEncoding=UTF-8

sonar.sources=services,api,shared,.github
sonar.tests=services/core-api/src/test,services/download-worker/src/test,services/notification-service/src/test,services/translation-service/src/test,api/scraper/tests,services/semantic-service/tests,services/webapp/src/main/resources/frontend/src
sonar.test.inclusions=**/*Test.java,**/test_*.py,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/target/**,**/dist/**,**/node_modules/**,**/.pytest_cache/**,**/.ruff_cache/**,**/build/**,**/docs/memorie/**
sonar.coverage.exclusions=**/db/migration/**,**/alembic/versions/**,**/Main.java,**/*Config.java,**/vite-env.d.ts

sonar.java.binaries=services/*/target/classes
sonar.java.test.binaries=services/*/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=services/core-api/target/site/jacoco/jacoco.xml,services/download-worker/target/site/jacoco/jacoco.xml,services/notification-service/target/site/jacoco/jacoco.xml,services/translation-service/target/site/jacoco/jacoco.xml
sonar.python.version=3.14
sonar.python.coverage.reportPaths=api/scraper/coverage.xml,services/semantic-service/coverage.xml
sonar.javascript.lcov.reportPaths=services/webapp/src/main/resources/frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=services/webapp/src/main/resources/frontend/tsconfig.json
