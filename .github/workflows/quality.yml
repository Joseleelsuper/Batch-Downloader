name: Quality gate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Verify Java services
        run: mvn -B verify

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/scraper/requirements.txt
      - run: pip install -r requirements.txt ruff mypy pytest-cov
      - run: ruff check .
      - run: mypy app --ignore-missing-imports
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webapp/src/main/resources/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/webapp/src/main/resources/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --coverage
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.2 lint shared/contracts/openapi/batch-downloader-api.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@3.4.2 validate shared/contracts/asyncapi/messaging.yaml

  sonar:
    if: github.event_name == 'push'
    needs: [java, scraper, frontend, contracts]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: mvn -B verify
      - run: pip install -r api/scraper/requirements.txt pytest-cov
      - run: pytest api/scraper --cov=api/scraper/app --cov-report=xml:api/scraper/coverage.xml
      - run: npm ci && npm test -- --run --coverage
        working-directory: services/webapp/src/main/resources/frontend
      - name: SonarQube scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
