name: Quality gate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect covered changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      scraper: ${{ steps.filter.outputs.scraper }}
      semantic: ${{ steps.filter.outputs.semantic }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      compose: ${{ steps.filter.outputs.compose }}
      linux_installer: ${{ steps.filter.outputs.linux_installer }}
      sonar: ${{ steps.filter.outputs.sonar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Match changed files to test coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACDMRT "${BASE_SHA}" "${HEAD_SHA}")
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff-tree --root --no-commit-id --name-only -r "${HEAD_SHA}")
          else
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACDMRT "${BEFORE_SHA}" "${HEAD_SHA}")
          fi

          java=false
          scraper=false
          semantic=false
          frontend=false
          contracts=false
          compose=false
          linux_installer=false
          sonar=false

          for file in "${changed_files[@]}"; do
            case "${file}" in
              pom.xml|shared/java-contracts/*|services/core-api/src/*|services/core-api/pom.xml|services/download-worker/src/*|services/download-worker/pom.xml|services/notification-service/src/*|services/notification-service/pom.xml|services/translation-service/src/*|services/translation-service/pom.xml)
                java=true
                ;;
            esac
            case "${file}" in
              api/scraper/*)
                scraper=true
                ;;
            esac
            case "${file}" in
              services/semantic-service/*)
                semantic=true
                ;;
            esac
            case "${file}" in
              services/webapp/src/main/resources/frontend/*)
                frontend=true
                ;;
            esac
            case "${file}" in
              shared/contracts/*|scripts/quality/*|services/core-api/src/main/java/*|services/translation-service/src/main/java/*|services/webapp/src/main/resources/frontend/src/api/*)
                contracts=true
                ;;
            esac
            case "${file}" in
              docker-compose.yml|docker-compose.ghcr.yml|api/scraper/docker-compose.yml|services/*/docker-compose.yml|.env.example|api/scraper/.env.example|services/*/.env.example|docker/*|scripts/compose_health.py|scripts/tests/*|scripts/deployment/*|services/*/src/main/resources/application.properties)
                compose=true
                ;;
            esac
            case "${file}" in
              scripts/linux-installer/*|services/download-worker/src/main/resources/linux-installer/*)
                linux_installer=true
                ;;
            esac
            case "${file}" in
              sonar-project.properties)
                sonar=true
                ;;
            esac
          done

          if [[ "${java}" == true || "${scraper}" == true || "${semantic}" == true || "${frontend}" == true || "${contracts}" == true ]]; then
            sonar=true
          fi

          {
            echo "java=${java}"
            echo "scraper=${scraper}"
            echo "semantic=${semantic}"
            echo "frontend=${frontend}"
            echo "contracts=${contracts}"
            echo "compose=${compose}"
            echo "linux_installer=${linux_installer}"
            echo "sonar=${sonar}"
          } >> "${GITHUB_OUTPUT}"

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Java services
        run: mvn -B verify

  scraper:
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/scraper/requirements.txt
            api/scraper/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app --ignore-missing-imports
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  scraper-free-threaded:
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the verified CPython 3.14t image
        run: docker build -t batch-downloader-scraper:3.14t api/scraper
      - name: Verify GIL state, native imports, Chromium and repeated concurrency
        run: >-
          docker run --rm --entrypoint python
          batch-downloader-scraper:3.14t
          /app/scripts/verify_free_threading.py
      - name: Run a bounded free-threaded benchmark smoke test
        run: >-
          docker run --rm --entrypoint python
          batch-downloader-scraper:3.14t
          /app/scripts/benchmark_free_threading.py
          --tasks 20 --repetitions 2

  semantic:
    needs: changes
    if: needs.changes.outputs.semantic == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/semantic-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/semantic-service/pyproject.toml
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webapp/src/main/resources/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/webapp/src/main/resources/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install PyYAML==6.0.3
      - name: Compare HTTP contracts with controllers and clients
        run: python -m unittest discover -s scripts/quality/tests -v
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.2 lint shared/contracts/openapi/batch-downloader-api.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@3.4.2 validate shared/contracts/asyncapi/messaging.yaml

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Render both Compose deployments
        run: |
          docker compose --env-file .env.example -f docker-compose.yml --profile "*" config --quiet
          docker compose --env-file .env.example -f docker-compose.ghcr.yml --profile "*" config --quiet
      - name: Verify Compose health policy and parity
        run: python scripts/compose_health.py validate --env-file .env.example
      - name: Test Compose health aggregation
        run: python -m unittest discover -s scripts/tests -v
      - name: Test production deployment safeguards
        run: python -m unittest discover -s scripts/deployment/tests -v

  linux-installer:
    needs: changes
    if: needs.changes.outputs.linux_installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run Linux installer verification image
        run: |
          docker build -f scripts/linux-installer/Dockerfile.test -t batch-downloader-linux-installer:test .
          docker run --rm batch-downloader-linux-installer:test

  sonar:
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.sonar == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, java, scraper, scraper-free-threaded, semantic, frontend, contracts, compose, linux-installer]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Require SonarCloud token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::Configure the SONAR_TOKEN repository secret before running SonarCloud analysis."
          exit 1
      - name: Compile Java for Sonar without running tests
        if: needs.changes.outputs.java != 'true'
        run: mvn -B -DskipTests test-compile
      - name: Verify Java services for Sonar coverage
        if: needs.changes.outputs.java == 'true'
        run: mvn -B verify
      - run: pip install -r api/scraper/requirements-dev.txt
        if: needs.changes.outputs.scraper == 'true'
      - run: pytest api/scraper --cov=api/scraper/app --cov-report=xml:api/scraper/coverage.xml
        if: needs.changes.outputs.scraper == 'true'
      - run: pip install -e "./services/semantic-service[test]"
        if: needs.changes.outputs.semantic == 'true'
      - run: pytest --cov=app --cov-report=xml
        if: needs.changes.outputs.semantic == 'true'
        working-directory: services/semantic-service
      - run: npm ci && npm run test:coverage
        if: needs.changes.outputs.frontend == 'true'
        working-directory: services/webapp/src/main/resources/frontend
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
