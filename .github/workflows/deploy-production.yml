name: Deploy production

on:
  workflow_run:
    workflows: ["Publish GHCR images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA whose immutable images are already in GHCR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}

    steps:
      - name: Checkout the exact release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Refuse automatic schema promotion
        run: |
          grep -qx 'CORE_API_FLYWAY_TARGET=16' .env.example
          grep -qx 'SCRAPER_ALEMBIC_TARGET=20260914_0021' .env.example

      - name: Test release automation
        run: python -m unittest discover -s scripts/deployment/tests -v

      - name: Deploy, wait, smoke test and rollback on failure
        run: python -m scripts.deployment.coolify_release --release-sha "${RELEASE_SHA}"
