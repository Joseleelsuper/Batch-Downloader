name: Deploy production

on:
  workflow_run:
    workflows: ["Publish GHCR images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA whose immutable images are already in GHCR
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout trusted automation from main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release automation
        run: python -m unittest discover -s scripts/deployment/tests -v

      - name: Verify release provenance and read its Compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.deployment.coolify_release --verify-only --release-sha "$RELEASE_SHA" --compose-file "$RUNNER_TEMP/release-compose.yml"

      - name: Connect to the production tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy
          args: --accept-dns=true
          ping: 100.122.77.98

      - name: Deploy, wait, smoke test and rollback on failure
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          python -m scripts.deployment.coolify_release --release-sha "$RELEASE_SHA" --compose-file "$RUNNER_TEMP/release-compose.yml"
