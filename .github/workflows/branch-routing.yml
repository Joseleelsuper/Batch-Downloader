name: Branch routing

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to validate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: branch-routing-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Read metadata only; never check out or execute pull request code.
      - uses: actions/github-script@v8
        with:
          script: |
            const number = context.payload.pull_request?.number
              ?? Number(context.payload.inputs.pull_request);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: number,
            });
            const allowed = pr.base.ref === 'development'
              || (pr.base.ref === 'main'
                && pr.head.ref === 'development'
                && pr.head.repo?.full_name === pr.base.repo.full_name);
            const description = allowed
              ? 'Ruta permitida: ramas → development → main.'
              : 'Dirige el PR a development; main solo acepta development del mismo repositorio.';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              state: allowed ? 'success' : 'failure',
              context: `Branch routing (${pr.base.ref})`,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!allowed) core.setFailed(description);
