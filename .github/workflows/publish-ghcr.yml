name: Publish GHCR images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: joseleelsuper
  IMAGE_PREFIX: batch-downloader

jobs:
  docker:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: webapp
            context: .
            dockerfile: services/webapp/Dockerfile
          - image: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - image: scraper
            context: api/scraper
            dockerfile: api/scraper/Dockerfile
          - image: semantic-service
            context: services/semantic-service
            dockerfile: services/semantic-service/Dockerfile
          - image: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - image: download-worker
            context: .
            dockerfile: services/download-worker/Dockerfile
          - image: translation-service
            context: .
            dockerfile: services/translation-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:main
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
