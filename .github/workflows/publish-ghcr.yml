name: Publish GHCR images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: joseleelsuper
  IMAGE_PREFIX: batch-downloader

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.target.suffix }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: webapp
            context: .
            dockerfile: services/webapp/Dockerfile
          - name: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - name: scraper
            context: api/scraper
            dockerfile: api/scraper/Dockerfile
          - name: semantic-service
            context: services/semantic-service
            dockerfile: services/semantic-service/Dockerfile
          - name: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - name: download-worker
            context: .
            dockerfile: services/download-worker/Dockerfile
          - name: translation-service
            context: .
            dockerfile: services/translation-service/Dockerfile
        target:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}:sha-${{ github.sha }}-${{ matrix.target.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.target.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.target.suffix }}

  publish-manifests:
    name: Publish ${{ matrix.image }} manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - webapp
          - core-api
          - scraper
          - semantic-service
          - notification-service
          - download-worker
          - translation-service

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and main manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:main" \
            "${IMAGE}:${SHA_TAG}-amd64" \
            "${IMAGE}:${SHA_TAG}-arm64"

      - name: Require AMD64 and ARM64 in the published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE}" > manifest.json
          jq -e '
            [.manifests[].platform
              | select(.os == "linux")
              | .architecture]
            | (index("amd64") != null and index("arm64") != null)
          ' manifest.json

  infrastructure-images:
    name: Infrastructure images
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Require AMD64 and ARM64 infrastructure images
        env:
          IMAGES: |
            mysql:8.4
            pgvector/pgvector:pg16
            rabbitmq:3.13-management
            ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
            axllent/mailpit:v1.30.0
        run: |
          while IFS= read -r image; do
            [ -n "${image}" ] || continue
            docker buildx imagetools inspect --raw "${image}" > manifest.json
            jq -e '
              [.manifests[].platform
                | select(.os == "linux")
                | .architecture]
              | (index("amd64") != null and index("arm64") != null)
            ' manifest.json
          done <<< "${IMAGES}"

  container-images:
    name: Container images
    if: always()
    needs: [build, publish-manifests, infrastructure-images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native build and manifest
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MANIFEST_RESULT: ${{ needs.publish-manifests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure-images.result }}
        run: |
          test "${BUILD_RESULT}" = success
          test "${INFRASTRUCTURE_RESULT}" = success
          if [ "${{ github.event_name }}" = push ]; then
            test "${MANIFEST_RESULT}" = success
          fi
